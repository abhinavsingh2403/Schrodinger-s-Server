# Unified Identity Profile for Schrödinger's Server
# Specified in SPEC.md Section 5.1 & Section 10
# All tiers (T1 Lite, T2 Hardened, T3 Real) must match this profile to prevent fingerprinting.

distro: "Debian"
release: "12 (bookworm)"
codename: "bookworm"
kernel: "6.1.0-21-amd64"
arch: "x86_64"
hostname: "srv-app-01"
banner: "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3"
server_version: "OpenSSH_9.2p1"

os:
  distro: "Debian"
  release: "12 (bookworm)"
  codename: "bookworm"
  kernel: "6.1.0-21-amd64"
  arch: "x86_64"

ssh:
  banner: "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3"
  server_version: "OpenSSH_9.2p1"

host:
  hostname: "srv-app-01"
  domain: "internal.lan"
  uptime_baseline_seconds: 345600

users:
  - username: "root"
    uid: 0
    gid: 0
    shell: "/bin/bash"
    home: "/root"
  - username: "debian"
    uid: 1000
    gid: 1000
    shell: "/bin/bash"
    home: "/home/debian"
