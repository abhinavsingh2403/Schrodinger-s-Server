# policy_lab.yaml: LAB MODE thresholds for live demonstrations
# Lower thresholds so interactive attackers visibly trigger T2 escalation
# Use with: python -m gatekeeper.decision_api --lab-mode
#
# Production thresholds remain in policy.yaml (unchanged).

version: "1.0.0-lab"

budget:
  max_escalation_fraction: 1.00      # In lab demos, allow any qualified interactive session to escalate
  max_concurrent_t3: 4               # Same T3 ceiling

thresholds:
  tau_v2:
    S0: 0.50
    S1: 0.40
    S2: 0.15                          # Login success (score 0.70) easily triggers T2
    S3: 0.04                          # Matches ML model's calibrated 10% budget threshold
    S4: 0.15
    S5: 0.10
  tau_v3:
    S0: 0.98
    S1: 0.95
    S2: 0.90
    S3: 0.85
    S4: 0.75
    S5: 0.65
  tau_a:
    S3: 0.80
    S4: 0.70
    S5: 0.60
