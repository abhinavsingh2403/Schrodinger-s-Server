# ============================================================================
# Cowrie Honeypot Configuration Overlay — Schrödinger's Server Project
# Pinned Version: Cowrie v3.1.6 (ea9513eda9ea0dac05f6ace7db84ca95e0571501)
# Pre-registered in SPEC.md Section 5.1 and SAFETY.md Section 2
# ============================================================================

[honeypot]
hostname = srv-app-01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = true
ttylog_path = var/lib/cowrie/tty
interactive_timeout = 300
authentication_timeout = 60

# Master system identity matching config/identity.yaml
reported_ssh_version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
timezone = UTC

# ----------------------------------------------------------------------------
# SSH Protocol Configuration (SSH Enabled on Isolated Internal Interface)
# ----------------------------------------------------------------------------
[ssh]
enabled = true
# Bind to 0.0.0.0 inside container so Docker bridge port forwarding reaches Cowrie.
# Host exposure remains restricted to 127.0.0.1 via docker-compose.yml port mapping.
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
auth_none_enabled = false
can_close = true

# ----------------------------------------------------------------------------
# Telnet Strictly Disabled per SAFETY.md Rule 2.1
# ----------------------------------------------------------------------------
[telnet]
enabled = false

# ----------------------------------------------------------------------------
# Output Plugins — Structured JSON Event Logging
# ----------------------------------------------------------------------------
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamps = false

# ----------------------------------------------------------------------------
# Proxy / Backend Pool (Disabled by default; internal use only per SPEC 5.1)
# ----------------------------------------------------------------------------
[proxy]
enabled = false
