services:
  edge:
    build:
      context: ..
      dockerfile: infra/Dockerfile.edge
    ports:
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:8080:8080"
    networks: [internal_honeypot_net, publish_net]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
  sensor:
    build:
      context: ..
      dockerfile: infra/Dockerfile.sensor
    container_name: schrodinger-sensor
    networks: [internal_honeypot_net]
    volumes: [sensor-state:/state]
    cap_drop: [ALL]
    depends_on: [gatekeeper]
  gatekeeper:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gatekeeper
    environment:
      GATEKEEPER_PROFILE: ${GATEKEEPER_PROFILE:-DEFAULT}
    volumes: [gatekeeper-data:/app/data]
    networks: [internal_honeypot_net]
    cap_drop: [ALL]
  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    volumes: [gatekeeper-data:/app/data:ro]
    networks: [internal_honeypot_net]
    cap_drop: [ALL]
networks:
  internal_honeypot_net:
    internal: true
  publish_net:
    driver: bridge
volumes:
  gatekeeper-data:
  sensor-state:
