<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Schrödinger's Server</title>
<style>
:root {
  color-scheme: dark;
  --bg-canvas: #040711;
  --bg-surface: #0b111e;
  --bg-subtle: #060a13;
  --border-subtle: #1a2639;
  --border-strong: #324863;
  --text-primary: #edf3ff;
  --text-muted: #94a3b8;
  --accent-cyan: #38bdf8;
  --accent-focus: #56c7ed;
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--bg-canvas);
  color: var(--text-primary);
}
* { box-sizing: border-box; }
*:focus-visible {
  outline: 2px solid var(--accent-focus);
  outline-offset: 2px;
}
body {
  margin: 0;
  padding: 14px;
  line-height: 1.5;
  min-width: 320px;
}
@media (min-width: 768px) {
  body { padding: 24px; }
}
a { color: var(--accent-cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
.topnav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.topnav a {
  padding: 7px 13px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
  font-size: 13px;
  font-weight: 600;
  color: #abedff;
  transition: background .15s, border-color .15s;
}
.topnav a:hover {
  background: #15253c;
  border-color: var(--accent-focus);
  text-decoration: none;
}
.topnav a.active {
  background: #123d55;
  border-color: var(--accent-focus);
  color: #fff;
}
header.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
h1 { font-size: 24px; margin: 0; font-weight: 700; }
h2 { font-size: 18px; margin: 0 0 10px 0; font-weight: 600; }
h3 { font-size: 15px; margin: 0 0 8px 0; font-weight: 600; }
.muted { color: var(--text-muted); font-size: 13px; }
#banner {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 18px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
#banner.warn {
  background: #3d2812;
  border: 2px solid #fb923c;
  color: #fed7aa;
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.card.warn {
  border-color: rgba(251, 146, 60, 0.4);
  background: #1a140c;
}
.value { font-size: 24px; font-weight: 700; margin-top: 6px; }
.tools {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
input, select, button {
  font: inherit;
  padding: 7px 11px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  background: var(--bg-subtle);
  color: var(--text-primary);
  font-size: 13px;
}
button { cursor: pointer; font-weight: 600; }
button:hover { background: #15253c; border-color: var(--accent-focus); }
button.active-filter {
  background: #123d55;
  border-color: var(--accent-focus);
  color: #fff;
}
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  margin: 2px;
  font-size: 11px;
  font-weight: 600;
  font-family: ui-monospace, monospace;
  border: 1px solid var(--border-subtle);
  background: var(--bg-subtle);
}
.badge.done { background: #0f3d2e; color: #baffd8; border-color: #34a87c; }
.badge.exploratory { background: #123d55; color: #abedff; border-color: #56c7ed; }
.badge.invalid { background: #3d1a1a; color: #fca5a5; border-color: #f87171; }
.badge.notrun, .badge.inconclusive, .badge.warn { background: #3d2812; color: #fed7aa; border-color: #fb923c; }
.badge.T1 { background: #123d55; color: #abedff; border-color: #56c7ed; }
.badge.T2 { background: #3d2812; color: #fed7aa; border-color: #fb923c; }
.badge.T3 { background: #331a47; color: #e9d5ff; border-color: #c084fc; }

.scroll {
  overflow-x: auto;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  position: sticky;
  top: 0;
  background: #182941;
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-strong);
  font-family: ui-monospace, monospace;
}
td {
  padding: 8px 10px;
  border-bottom: 1px solid #1e2d42;
  vertical-align: top;
}
tr:hover { background: rgba(56, 189, 248, 0.04); }

.item-btn {
  width: 100%;
  text-align: left;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  display: block;
}
.item-btn:hover, .item-btn.selected {
  border-color: var(--accent-focus);
  background: #13253b;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  overflow-wrap: anywhere;
}
pre.md-view {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px;
  overflow: auto;
  max-height: 480px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  line-height: 1.45;
  margin: 0;
}
.tree details { margin-left: 12px; margin-top: 4px; }
.tree summary { cursor: pointer; font-weight: 600; color: #abedff; }
.tree-leaf {
  margin-left: 12px;
  padding: 2px 0;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
}
.timeline {
  border-left: 2px solid var(--border-strong);
  padding-left: 18px;
  margin-left: 8px;
}
.timeline-step {
  position: relative;
  margin-bottom: 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px;
}
.timeline-step::before {
  content: '';
  position: absolute;
  left: -25px;
  top: 16px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-focus);
  border: 2px solid var(--bg-canvas);
}
.timeline-step.tier-transition::before {
  background: #fb923c;
  box-shadow: 0 0 6px #fb923c;
}
svg.chart {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.chart-bar {
  transition: opacity .15s;
}
.chart-bar:hover {
  opacity: 0.8;
}
footer.page-foot {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  font-family: ui-monospace, monospace;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
@media print {
  body { background: #fff; color: #000; }
  .topnav, #banner { display: none; }
  .card { border: 1px solid #ccc; background: #fff; color: #000; }
}
</style>
</head>
<body>
<nav class="topnav" aria-label="Dashboard">
  <a href="/">Overview</a>
  <a href="/evidence">Evidence Vault</a>
  <a href="/ml">ML Experiments</a>
  <a href="/cost">Cost</a>
  <a href="/session">Session Timeline</a>
  <a href="/research">Research Archive</a>
</nav>
<main>
  <header class="page-head">
    <h1>{{title}}</h1>
    <div id="page-status" class="muted" role="status" aria-live="polite">NO DATA · waiting for API</div>
  </header>
  <p id="banner">Scope UNKNOWN · Policy profile UNKNOWN</p>
  <div id="content" aria-live="polite">NO DATA · No evidence loaded.</div>
</main>
<footer class="page-foot">
  <div id="foot-left">SCHRÖDINGER'S SERVER &bull; RESEARCH DEFENSE ARTIFACT</div>
  <div id="foot-right">Scope: UNKNOWN &bull; Profile: UNKNOWN &bull; Loopback</div>
</footer>
<script>
'use strict';

const el = (tag, textValue = '', cls = '') => {
  const node = document.createElement(tag);
  if (textValue !== null && textValue !== undefined && textValue !== '') {
    node.textContent = String(textValue);
  }
  if (cls) node.className = cls;
  return node;
};

const statusClass = (s) => {
  const v = String(s || '').toUpperCase();
  if (v === 'DONE' || v === 'RECORDED') return 'badge done';
  if (v === 'EXPLORATORY') return 'badge exploratory';
  if (v === 'INVALID') return 'badge invalid';
  if (v === 'NOT RUN' || v === 'INCONCLUSIVE') return 'badge inconclusive';
  return 'badge';
};

function updateFooter(meta) {
  const right = document.getElementById('foot-right');
  if (!right) return;
  const scope = (meta && meta.scope) ? meta.scope : 'UNKNOWN';
  const profile = (meta && meta.policy_profile) ? meta.policy_profile : 'UNKNOWN';
  right.textContent = `Scope: ${scope} • Profile: ${profile} • Mode: Loopback`;
}

function setBanner(meta, extraWarnText = '') {
  const banner = document.getElementById('banner');
  const scope = (meta && meta.scope) ? meta.scope : 'UNKNOWN';
  const profile = (meta && meta.policy_profile) ? meta.policy_profile : 'UNKNOWN';
  const parts = [`Scope ${scope}`, `Policy profile ${profile}`];
  if (meta && meta.demo_label) parts.push(meta.demo_label);
  if (meta && meta.status) parts.push(`Status ${meta.status}`);
  if (meta && meta.source_file) parts.push(`Source ${meta.source_file}`);
  if (extraWarnText) {
    parts.push(extraWarnText);
    banner.className = 'warn';
  } else if (meta && (meta.demo_label || meta.status === 'INVALID' || meta.status === 'INCONCLUSIVE')) {
    banner.className = 'warn';
  } else {
    banner.className = '';
  }
  banner.textContent = parts.join(' · ');
  updateFooter(meta);
}

function setStatus(msg) {
  const st = document.getElementById('page-status');
  if (st) st.textContent = msg;
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(8000) });
  const body = await res.json();
  return { ok: res.ok, status: res.status, body };
}

function renderJsonTree(value, keyLabel = null) {
  if (value === null || typeof value !== 'object') {
    const row = el('div', '', 'tree-leaf');
    if (keyLabel !== null) {
      const k = el('span', keyLabel + ': ', 'muted');
      row.appendChild(k);
    }
    row.appendChild(el('span', value === null ? 'null' : String(value)));
    return row;
  }
  const details = document.createElement('details');
  details.open = keyLabel === null;
  const isArr = Array.isArray(value);
  const keys = Object.keys(value);
  const label = keyLabel !== null
    ? `${keyLabel} (${isArr ? value.length + ' items' : keys.length + ' keys'})`
    : (isArr ? `Array (${value.length})` : `Object (${keys.length})`);
  details.appendChild(el('summary', label));
  for (const k of keys) {
    details.appendChild(renderJsonTree(value[k], k));
  }
  return details;
}

function makeBadgeRow(meta) {
  const wrap = el('div');
  if (meta.scope) wrap.appendChild(el('span', `Scope: ${meta.scope}`, 'badge'));
  if (meta.status) wrap.appendChild(el('span', meta.status, statusClass(meta.status)));
  if (meta.policy_profile) wrap.appendChild(el('span', `Profile: ${meta.policy_profile}`, 'badge'));
  if (meta.demo_label) wrap.appendChild(el('span', meta.demo_label, 'badge warn'));
  if (meta.source_file) wrap.appendChild(el('span', meta.source_file, 'badge mono'));
  return wrap;
}

function makeCopyButton(textToCopy, label = 'Copy') {
  const btn = el('button', label);
  btn.type = 'button';
  btn.style.marginLeft = '8px';
  btn.style.fontSize = '11px';
  btn.style.padding = '3px 8px';
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(textToCopy);
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = label; }, 1500);
    } catch (e) {
      btn.textContent = 'Failed';
    }
  });
  return btn;
}

// -------------------------------------------------------------
// a. Evidence Vault
// -------------------------------------------------------------
async function initEvidence() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading evidence index and progress...', 'muted'));
  let idxRes, progRes;
  try {
    [idxRes, progRes] = await Promise.all([
      fetchJson('/api/evidence/index'),
      fetchJson('/api/progress')
    ]);
  } catch (e) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · Failed to reach evidence endpoints.', 'card'));
    return;
  }

  const idx = idxRes.body;
  setBanner(idx);
  setStatus(`Loaded ${idx.items ? idx.items.length : 0} evidence items`);

  const container = el('div');

  // Progress Checklist Card
  const progCard = el('section', '', 'card');
  progCard.appendChild(el('h2', 'Project Progress Checklist'));
  const pData = progRes && progRes.body ? progRes.body.data : null;
  const pNote = (progRes && progRes.body && progRes.body.note)
    ? progRes.body.note
    : 'Weighted checklist of project work, not a performance measure.';
  progCard.appendChild(el('p', pNote, 'muted'));
  if (progRes && progRes.body) {
    progCard.appendChild(makeBadgeRow(progRes.body));
  }
  if (!pData || !Array.isArray(pData.items)) {
    progCard.appendChild(el('p', 'NO DATA · Progress checklist unavailable.', 'muted'));
  } else {
    const summaryLine = el('p', `Earned ${pData.earned} / ${pData.total} (${pData.percentage}%)`, 'value');
    progCard.appendChild(summaryLine);
    const tblWrap = el('div', '', 'scroll');
    const tbl = el('table');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['Item', 'Weight', 'Status', 'Notes']) htr.appendChild(el('th', h));
    thead.appendChild(htr);
    const tbody = el('tbody');
    for (const row of pData.items) {
      const tr = el('tr');
      tr.appendChild(el('td', row[0]));
      tr.appendChild(el('td', String(row[1]), 'mono'));
      const stTd = el('td');
      stTd.appendChild(el('span', row[2], statusClass(row[2] === 'Done' ? 'done' : row[2] === 'Partial' ? 'exploratory' : 'NOT RUN')));
      tr.appendChild(stTd);
      tr.appendChild(el('td', row[3], 'muted'));
      tbody.appendChild(tr);
    }
    tbl.append(thead, tbody);
    tblWrap.appendChild(tbl);
    progCard.appendChild(tblWrap);
  }
  container.appendChild(progCard);

  // Evidence Index + Detail Drawer
  const grid = el('div', '', 'grid-2');
  const listCard = el('section', '', 'card');
  listCard.appendChild(el('h2', 'Allowlisted Evidence Catalog'));
  const items = (idx && Array.isArray(idx.items)) ? idx.items : [];
  if (!items.length) {
    listCard.appendChild(el('p', idx.empty || 'NO DATA · No evidence items indexed.', 'muted'));
    grid.appendChild(listCard);
    container.appendChild(grid);
    content.replaceChildren(container);
    return;
  }

  let activeStatusFilter = 'ALL';
  let activeKindFilter = 'ALL';
  let sortField = 'title';
  let searchText = '';
  let selectedId = null;

  const tools = el('div', '', 'tools');
  const searchInput = document.createElement('input');
  searchInput.placeholder = 'Search by ID, title, or source...';
  searchInput.setAttribute('aria-label', 'Filter evidence');
  tools.appendChild(searchInput);

  const sortSelect = document.createElement('select');
  sortSelect.setAttribute('aria-label', 'Sort evidence items');
  const sortTitle = el('option', 'Sort by Title'); sortTitle.value = 'title';
  const sortStatus = el('option', 'Sort by Status'); sortStatus.value = 'status';
  const sortKind = el('option', 'Sort by Kind'); sortKind.value = 'kind';
  sortSelect.append(sortTitle, sortStatus, sortKind);
  sortSelect.addEventListener('change', () => {
    sortField = sortSelect.value;
    renderList();
  });
  tools.appendChild(sortSelect);

  const filterStatuses = ['ALL', 'done', 'exploratory', 'NOT RUN', 'INVALID', 'INCONCLUSIVE'];
  const statusFilterBtns = [];
  for (const fs of filterStatuses) {
    const btn = el('button', fs === 'ALL' ? 'All Status' : fs, fs === 'ALL' ? 'active-filter' : '');
    btn.type = 'button';
    btn.addEventListener('click', () => {
      activeStatusFilter = fs;
      for (const b of statusFilterBtns) b.className = (b === btn) ? 'active-filter' : '';
      renderList();
    });
    statusFilterBtns.push(btn);
    tools.appendChild(btn);
  }

  listCard.appendChild(tools);
  const listWrap = el('div', '', 'scroll');
  listCard.appendChild(listWrap);

  const inspectorCard = el('section', '', 'card');
  inspectorCard.appendChild(el('h2', 'Evidence Detail Drawer'));
  const inspectorMeta = el('div', '', 'muted');
  inspectorMeta.appendChild(el('p', 'Select an evidence item to inspect its recorded contents.'));
  const inspectorBody = el('div');
  inspectorCard.append(inspectorMeta, inspectorBody);

  async function inspectItem(item) {
    selectedId = item.id;
    renderList();
    inspectorMeta.replaceChildren(el('p', `Loading ${item.id}...`, 'muted'));
    inspectorBody.replaceChildren();

    try {
      const res = await fetchJson(`/api/evidence/${encodeURIComponent(item.id)}`);
      const payload = res.body;
      inspectorMeta.replaceChildren();
      const topTitleRow = el('div', '', 'tools');
      topTitleRow.appendChild(el('h3', payload.title || item.id));
      if (payload.source_file) {
        topTitleRow.appendChild(makeCopyButton(payload.source_file, 'Copy Source Path'));
      }
      inspectorMeta.appendChild(topTitleRow);
      inspectorMeta.appendChild(makeBadgeRow(payload));

      if (!res.ok || payload.data === null || payload.data === undefined) {
        inspectorBody.replaceChildren(el('p', payload.empty || 'NO DATA · Evidence unavailable.', 'muted'));
        return;
      }

      if (payload.kind === 'markdown') {
        const pre = el('pre', payload.data.text || '', 'md-view');
        inspectorBody.replaceChildren(pre);
      } else {
        const copyJsonBtn = makeCopyButton(JSON.stringify(payload.data, null, 2), 'Copy JSON Payload');
        inspectorBody.appendChild(copyJsonBtn);
        const treeWrap = el('div', '', 'tree scroll');
        treeWrap.style.marginTop = '10px';
        treeWrap.appendChild(renderJsonTree(payload.data));
        inspectorBody.appendChild(treeWrap);
      }
    } catch (e) {
      inspectorMeta.replaceChildren(el('p', 'NO DATA · Failed to load evidence item.', 'muted'));
      inspectorBody.replaceChildren();
    }
  }

  function renderList() {
    listWrap.replaceChildren();
    const q = searchText.trim().toLowerCase();
    const filtered = items.filter((it) => {
      if (activeStatusFilter !== 'ALL' && String(it.status).toUpperCase() !== activeStatusFilter.toUpperCase()) return false;
      if (!q) return true;
      return `${it.id} ${it.title} ${it.source_file}`.toLowerCase().includes(q);
    });

    filtered.sort((a, b) => {
      if (sortField === 'status') return String(a.status).localeCompare(String(b.status));
      if (sortField === 'kind') return String(a.kind).localeCompare(String(b.kind));
      return String(a.title || a.id).localeCompare(String(b.title || b.id));
    });

    if (!filtered.length) {
      listWrap.appendChild(el('p', 'No matching evidence items.', 'muted'));
      return;
    }
    for (const it of filtered) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn' + (selectedId === it.id ? ' selected' : '');
      const headRow = el('div', `${it.title || it.id} (${it.kind})`, 'font-mono');
      headRow.style.fontWeight = '700';
      btn.append(headRow, makeBadgeRow(it));
      btn.addEventListener('click', () => inspectItem(it));
      listWrap.appendChild(btn);
    }
  }

  searchInput.addEventListener('input', () => {
    searchText = searchInput.value;
    renderList();
  });

  renderList();
  grid.append(listCard, inspectorCard);
  container.appendChild(grid);
  content.replaceChildren(container);
}

// -------------------------------------------------------------
// b. ML Experiments
// -------------------------------------------------------------
async function initMl() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading ML experiment metrics and verdict reports...', 'muted'));
  const settled = await Promise.allSettled([
    fetchJson('/api/evidence/metrics'),
    fetchJson('/api/evidence/EXPERIMENT1_RESULT'),
    fetchJson('/api/evidence/NULL_ROOT_CAUSE'),
    fetchJson('/api/evidence/ROOT_CAUSE')
  ]);

  const getBody = (idx) => (settled[idx].status === 'fulfilled' ? settled[idx].value : null);
  const metricsRes = getBody(0);
  const exp1Res = getBody(1);
  const nullRcRes = getBody(2);
  const rcRes = getBody(3);

  const metricsMeta = metricsRes ? metricsRes.body : null;
  setBanner(metricsMeta, 'No validated ML gain');
  if (!metricsRes && !exp1Res && !nullRcRes && !rcRes) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · ML evidence endpoints unavailable.', 'card'));
    return;
  }
  setStatus('Loaded ML experiment evidence');

  const container = el('div');

  // Overall verdict callout banner
  const callout = el('div', '', 'card warn');
  callout.appendChild(el('h2', 'Overall Protocol Outcome: No validated ML gain'));
  callout.appendChild(el('p', 'Post-hoc evaluations across stages S2, S4, and S5 establish no statistically verified predictive advantage over non-ML heuristic baselines under pre-registered leakage controls.', 'muted'));
  container.appendChild(callout);

  // Per-stage Verdicts Card
  const verdictCard = el('section', '', 'card');
  verdictCard.appendChild(el('h2', 'Experiment 1 Stage Verdicts'));
  if (metricsMeta) verdictCard.appendChild(makeBadgeRow(metricsMeta));
  const mData = metricsMeta && metricsMeta.data ? metricsMeta.data : null;
  if (!mData || typeof mData !== 'object') {
    verdictCard.appendChild(el('p', (metricsMeta && metricsMeta.empty) || 'NO DATA · metrics.json unavailable.', 'muted'));
  } else {
    const tbl = el('table');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['Stage', 'Day', 'Baseline', 'Delta', 'Interval', 'Verdict']) htr.appendChild(el('th', h));
    thead.appendChild(htr);
    const tbody = el('tbody');
    for (const [stage, st] of Object.entries(mData)) {
      const tr = el('tr');
      tr.appendChild(el('td', stage, 'mono'));
      tr.appendChild(el('td', st.day || 'UNKNOWN'));
      tr.appendChild(el('td', st.baseline || 'UNKNOWN'));
      tr.appendChild(el('td', st.delta !== undefined && st.delta !== null ? String(st.delta) : 'NO DATA', 'mono'));
      tr.appendChild(el('td', Array.isArray(st.interval) ? `[${st.interval.join(', ')}]` : 'NO DATA', 'mono'));
      const vTd = el('td');
      vTd.appendChild(el('span', st.verdict || 'UNKNOWN', statusClass(st.verdict)));
      tr.appendChild(vTd);
      tbody.appendChild(tr);
    }
    tbl.append(thead, tbody);
    verdictCard.appendChild(tbl);
  }
  container.appendChild(verdictCard);

  // SVG Bar Charts & Budget Ladder
  if (mData && typeof mData === 'object') {
    const ladderCard = el('section', '', 'card');
    ladderCard.appendChild(el('h2', 'Recall by Budget Ladder & SVG Evaluation Chart'));
    const stageKeys = Object.keys(mData);
    let activeStage = stageKeys[0] || null;
    const tools = el('div', '', 'tools');
    const stageBtns = [];
    const chartWrap = el('div', '', 'scroll');
    const tableWrap = el('div', '', 'scroll');

    function renderStageVisuals(stageKey) {
      chartWrap.replaceChildren();
      tableWrap.replaceChildren();
      const st = mData[stageKey];
      if (!st || !st.metrics) {
        chartWrap.appendChild(el('p', 'NO DATA · No stage metrics.', 'muted'));
        return;
      }

      const rankers = Object.entries(st.metrics);
      const budgetSet = new Set();
      for (const [, rObj] of rankers) {
        if (rObj && rObj.budgets) {
          for (const bk of Object.keys(rObj.budgets)) budgetSet.add(bk);
        }
      }
      const budgets = [...budgetSet].sort((a, b) => parseFloat(a) - parseFloat(b));

      // Draw SVG chart for primary budget (e.g. 0.10 / 10%)
      const targetBudget = budgets.includes('0.1') ? '0.1' : (budgets[0] || null);
      if (targetBudget) {
        const svgCard = el('div');
        svgCard.appendChild(el('h3', `Recall Comparison at ${Number(targetBudget) * 100}% Budget (Stage ${stageKey})`));
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 600 240');
        svg.setAttribute('class', 'chart');
        svg.style.maxHeight = '240px';

        const barColors = {
          learned: '#f87171',
          shuffle: '#fb923c',
          constant: '#94a3b8',
          random: '#64748b',
          negative_activity: '#38bdf8',
          activity: '#818cf8',
          R7: '#34d399',
          ablation: '#cbd5e1'
        };

        const chartH = 170;
        const chartW = 520;
        const startX = 60;
        const startY = 20;

        // Random recall reference line = budget value
        const randomRefRecall = parseFloat(targetBudget);
        let maxRecall = Math.max(randomRefRecall, 0.4);
        for (const [, rObj] of rankers) {
          const rec = rObj && rObj.budgets && rObj.budgets[targetBudget] ? rObj.budgets[targetBudget].recall : 0;
          if (rec > maxRecall) maxRecall = rec;
        }

        // Grid lines
        for (let step = 0; step <= 4; step++) {
          const yVal = (maxRecall * step) / 4;
          const yPos = startY + chartH - (yVal / maxRecall) * chartH;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', String(startX));
          line.setAttribute('x2', String(startX + chartW));
          line.setAttribute('y1', String(yPos));
          line.setAttribute('y2', String(yPos));
          line.setAttribute('stroke', '#1a2639');
          svg.appendChild(line);

          const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          txt.setAttribute('x', String(startX - 8));
          txt.setAttribute('y', String(yPos + 4));
          txt.setAttribute('text-anchor', 'end');
          txt.setAttribute('fill', '#94a3b8');
          txt.setAttribute('font-size', '10');
          txt.setAttribute('font-family', 'ui-monospace');
          txt.textContent = yVal.toFixed(2);
          svg.appendChild(txt);
        }

        // Random reference dashed line
        const refY = startY + chartH - (randomRefRecall / maxRecall) * chartH;
        const refLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        refLine.setAttribute('x1', String(startX));
        refLine.setAttribute('x2', String(startX + chartW));
        refLine.setAttribute('y1', String(refY));
        refLine.setAttribute('y2', String(refY));
        refLine.setAttribute('stroke', '#fbbf24');
        refLine.setAttribute('stroke-dasharray', '4,4');
        svg.appendChild(refLine);

        const refText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        refText.setAttribute('x', String(startX + chartW - 4));
        refText.setAttribute('y', String(refY - 6));
        refText.setAttribute('text-anchor', 'end');
        refText.setAttribute('fill', '#fbbf24');
        refText.setAttribute('font-size', '10');
        refText.setAttribute('font-family', 'ui-monospace');
        refText.textContent = `Random Reference (${randomRefRecall.toFixed(2)})`;
        svg.appendChild(refText);

        // Bars
        const barW = Math.max(16, Math.floor(chartW / rankers.length) - 10);
        for (let i = 0; i < rankers.length; i++) {
          const [rName, rObj] = rankers[i];
          const rec = rObj && rObj.budgets && rObj.budgets[targetBudget] ? rObj.budgets[targetBudget].recall : 0;
          const bH = (rec / maxRecall) * chartH;
          const x = startX + i * (barW + 10) + 6;
          const y = startY + chartH - bH;

          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', String(x));
          rect.setAttribute('y', String(y));
          rect.setAttribute('width', String(barW));
          rect.setAttribute('height', String(bH));
          rect.setAttribute('fill', barColors[rName] || '#38bdf8');
          rect.setAttribute('rx', '3');
          rect.setAttribute('class', 'chart-bar');

          // Tooltip on SVG element
          const titleTag = document.createElementNS('http://www.w3.org/2000/svg', 'title');
          titleTag.textContent = `${rName}: recall ${rec} (Source: results/exp1/metrics.json)`;
          rect.appendChild(titleTag);
          svg.appendChild(rect);

          const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          lbl.setAttribute('x', String(x + barW / 2));
          lbl.setAttribute('y', String(startY + chartH + 16));
          lbl.setAttribute('text-anchor', 'middle');
          lbl.setAttribute('fill', '#94a3b8');
          lbl.setAttribute('font-size', '9');
          lbl.setAttribute('font-family', 'ui-monospace');
          lbl.textContent = rName.slice(0, 8);
          svg.appendChild(lbl);
        }

        svgCard.appendChild(svg);
        chartWrap.appendChild(svgCard);
      }

      // Detailed ladder table
      const tbl = el('table');
      const thead = el('thead');
      const htr = el('tr');
      htr.appendChild(el('th', 'Ranker'));
      htr.appendChild(el('th', 'PR-AUC'));
      for (const b of budgets) htr.appendChild(el('th', `Recall @ ${b}`));
      thead.appendChild(htr);
      const tbody = el('tbody');
      for (const [rName, rObj] of rankers) {
        const tr = el('tr');
        tr.appendChild(el('td', rName, 'mono'));
        tr.appendChild(el('td', rObj && rObj.pr_auc !== undefined ? String(rObj.pr_auc) : 'NO DATA', 'mono'));
        for (const b of budgets) {
          const bObj = rObj && rObj.budgets ? rObj.budgets[b] : null;
          const val = bObj && bObj.recall !== undefined && bObj.recall !== null ? String(bObj.recall) : 'NO DATA';
          tr.appendChild(el('td', val, 'mono'));
        }
        tbody.appendChild(tr);
      }
      tbl.append(thead, tbody);
      tableWrap.appendChild(tbl);
    }

    for (const sk of stageKeys) {
      const btn = el('button', sk, sk === activeStage ? 'active-filter' : '');
      btn.type = 'button';
      btn.addEventListener('click', () => {
        activeStage = sk;
        for (const b of stageBtns) b.className = (b === btn) ? 'active-filter' : '';
        renderStageVisuals(sk);
      });
      stageBtns.push(btn);
      tools.appendChild(btn);
    }
    ladderCard.append(tools, chartWrap, tableWrap);
    if (activeStage) renderStageVisuals(activeStage);
    container.appendChild(ladderCard);
  }

  // Markdown Reports with copy buttons and links
  for (const [label, res, idStr] of [
    ['Experiment 1 Verdict Summary', exp1Res, 'EXPERIMENT1_RESULT'],
    ['Experiment 0 Null Root Cause', nullRcRes, 'NULL_ROOT_CAUSE'],
    ['Experiment 1 Root Cause Diagnosis', rcRes, 'ROOT_CAUSE']
  ]) {
    const mdCard = el('section', '', 'card');
    const headRow = el('div', '', 'tools');
    headRow.appendChild(el('h2', label));
    headRow.appendChild(el('a', `[Open in Evidence Vault: ${idStr}]`, 'mono muted'));
    mdCard.appendChild(headRow);

    if (!res || !res.body) {
      mdCard.appendChild(el('p', 'NO DATA · Report unavailable.', 'muted'));
    } else {
      mdCard.appendChild(makeBadgeRow(res.body));
      if (!res.ok || !res.body.data || typeof res.body.data.text !== 'string') {
        mdCard.appendChild(el('p', res.body.empty || 'NO DATA · Markdown unavailable.', 'muted'));
      } else {
        const pre = el('pre', res.body.data.text, 'md-view');
        mdCard.appendChild(pre);
      }
    }
    container.appendChild(mdCard);
  }

  content.replaceChildren(container);
}

// -------------------------------------------------------------
// c. Cost
// -------------------------------------------------------------
async function initCost() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading cost evidence and resource measurements...', 'muted'));
  const settled = await Promise.allSettled([
    fetchJson('/api/evidence/COST_PER_TIER'),
    fetchJson('/api/evidence/cost_T1_only'),
    fetchJson('/api/evidence/cost_T2_only'),
    fetchJson('/api/evidence/cost_model'),
    fetchJson('/api/evidence/concurrency_probe')
  ]);

  const getBody = (idx) => (settled[idx].status === 'fulfilled' ? settled[idx].value : null);
  const costTierRes = getBody(0);
  const t1Res = getBody(1);
  const t2Res = getBody(2);
  const modelRes = getBody(3);
  const probeRes = getBody(4);

  const costMeta = costTierRes ? costTierRes.body : (t1Res ? t1Res.body : null);
  setBanner(costMeta);
  if (!costTierRes && !t1Res && !t2Res && !modelRes) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · Cost endpoints unavailable.', 'card'));
    return;
  }
  setStatus('Loaded cost study and resource measurements');

  const container = el('div');

  // Mandatory limitation callout from COST_PER_TIER
  const limitCard = el('section', '', 'card warn');
  limitCard.appendChild(el('h2', 'Cost Study Methodology & Confounding Caveat'));
  let matchedParagraph = 'Matched session count and pacing window. Sampling includes pauses and early T1 time inside T2-final sessions. Both personas share one sensor process. Terminal allocation also differs, so this cannot isolate a persona-only resource effect.';
  if (costTierRes && costTierRes.body && costTierRes.body.data && typeof costTierRes.body.data.text === 'string') {
    const rawText = costTierRes.body.data.text;
    const parts = rawText.split(/\r?\n\r?\n/);
    const found = parts.find((p) => p.trim().startsWith('Matched session count'));
    if (found) matchedParagraph = found.trim();
  }
  limitCard.appendChild(el('p', matchedParagraph));
  if (costTierRes && costTierRes.body) limitCard.appendChild(makeBadgeRow(costTierRes.body));
  container.appendChild(limitCard);

  // Range-Bar Visuals (Min-Max per Repeat, T1 vs T2)
  const t1Runs = (t1Res && t1Res.body && t1Res.body.data && Array.isArray(t1Res.body.data.runs)) ? t1Res.body.data.runs : [];
  const t2Runs = (t2Res && t2Res.body && t2Res.body.data && Array.isArray(t2Res.body.data.runs)) ? t2Res.body.data.runs : [];

  if (t1Runs.length || t2Runs.length) {
    const rangeCard = el('section', '', 'card');
    rangeCard.appendChild(el('h2', 'Resource Spread by Repeat (Min-Max Range)'));
    rangeCard.appendChild(el('p', 'Visualizing mean and max CPU percentage across repeated runs, never single points without spread.', 'muted'));

    const rangeWrap = el('div', '', 'scroll');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 600 200');
    svg.setAttribute('class', 'chart');
    svg.style.maxHeight = '200px';

    const maxCpu = 20; // 0-20% scale
    const chartH = 130;
    const chartW = 500;
    const startX = 60;
    const startY = 20;

    // Grid lines
    for (let i = 0; i <= 4; i++) {
      const val = (maxCpu * i) / 4;
      const y = startY + chartH - (val / maxCpu) * chartH;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', String(startX));
      line.setAttribute('x2', String(startX + chartW));
      line.setAttribute('y1', String(y));
      line.setAttribute('y2', String(y));
      line.setAttribute('stroke', '#1a2639');
      svg.appendChild(line);

      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', String(startX - 8));
      txt.setAttribute('y', String(y + 4));
      txt.setAttribute('text-anchor', 'end');
      txt.setAttribute('fill', '#94a3b8');
      txt.setAttribute('font-size', '10');
      txt.setAttribute('font-family', 'ui-monospace');
      txt.textContent = `${val.toFixed(0)}%`;
      svg.appendChild(txt);
    }

    const allRuns = [
      ...t1Runs.map((r) => ({ target: 'T1', ...r })),
      ...t2Runs.map((r) => ({ target: 'T2', ...r }))
    ];

    const slotW = Math.floor(chartW / (allRuns.length || 1));
    for (let i = 0; i < allRuns.length; i++) {
      const r = allRuns[i];
      const meanCpu = r.stats ? r.stats.mean_cpu_pct || 0 : 0;
      const maxC = r.stats ? r.stats.max_cpu_pct || 0 : 0;
      const x = startX + i * slotW + slotW / 2;

      const yMax = startY + chartH - Math.min(chartH, (maxC / maxCpu) * chartH);
      const yMean = startY + chartH - Math.min(chartH, (meanCpu / maxCpu) * chartH);

      // Whisker line from mean to max
      const whisker = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      whisker.setAttribute('x1', String(x));
      whisker.setAttribute('x2', String(x));
      whisker.setAttribute('y1', String(yMax));
      whisker.setAttribute('y2', String(startY + chartH));
      whisker.setAttribute('stroke', r.target === 'T1' ? '#38bdf8' : '#fb923c');
      whisker.setAttribute('stroke-width', '2');
      svg.appendChild(whisker);

      // Mean point
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', String(x));
      dot.setAttribute('cy', String(yMean));
      dot.setAttribute('r', '4');
      dot.setAttribute('fill', '#fff');
      svg.appendChild(dot);

      // Label
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', String(x));
      lbl.setAttribute('y', String(startY + chartH + 16));
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('fill', '#94a3b8');
      lbl.setAttribute('font-size', '9');
      lbl.setAttribute('font-family', 'ui-monospace');
      lbl.textContent = `${r.target}-R${r.repeat}`;
      svg.appendChild(lbl);
    }

    rangeWrap.appendChild(svg);
    rangeCard.appendChild(rangeWrap);
    container.appendChild(rangeCard);
  }

  // Matched Measurements Table (T1 vs T2)
  const measCard = el('section', '', 'card');
  measCard.appendChild(el('h2', 'Matched Hardware Resource Measurements'));
  measCard.appendChild(el('p', 'Comparative CPU and memory observed across isolated pure runs (Spike S2 protocol).', 'muted'));

  if (!t1Runs.length && !t2Runs.length) {
    measCard.appendChild(el('p', 'NO DATA · Pure tier measurements unavailable.', 'muted'));
  } else {
    const tbl = el('table');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['Target Tier', 'Repeat', 'Wall Time (s)', 'Mean CPU %', 'Max CPU %', 'Mean MB', 'Max MB']) {
      htr.appendChild(el('th', h));
    }
    thead.appendChild(htr);
    const tbody = el('tbody');

    const addRunRows = (target, runs) => {
      for (const r of runs) {
        const tr = el('tr');
        const st = r.stats || {};
        tr.appendChild(el('td', target, 'mono'));
        tr.appendChild(el('td', String(r.repeat || ''), 'mono'));
        tr.appendChild(el('td', st.wall_time !== undefined ? String(st.wall_time) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.mean_cpu_pct !== undefined ? String(st.mean_cpu_pct) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.max_cpu_pct !== undefined ? String(st.max_cpu_pct) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.mean_memory_mb !== undefined ? String(st.mean_memory_mb) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.max_memory_mb !== undefined ? String(st.max_memory_mb) : 'NO DATA', 'mono'));
        tbody.appendChild(tr);
      }
    };
    addRunRows('T1', t1Runs);
    addRunRows('T2', t2Runs);
    tbl.append(thead, tbody);
    measCard.appendChild(el('div', '', 'scroll')).appendChild(tbl);
  }
  container.appendChild(measCard);

  // Mixed Sensor Baseline
  const modelCard = el('section', '', 'card');
  modelCard.appendChild(el('h2', 'Mixed Container Baseline (cost_model.json)'));
  if (modelRes && modelRes.body) modelCard.appendChild(makeBadgeRow(modelRes.body));
  const modelData = modelRes && modelRes.body ? modelRes.body.data : null;
  if (!modelData) {
    modelCard.appendChild(el('p', 'NO DATA · cost_model baseline unavailable.', 'muted'));
  } else {
    if (modelData.interpretation) {
      modelCard.appendChild(el('p', modelData.interpretation, 'muted'));
    }
    const kpis = el('div', '', 'kpis');
    const addKpi = (label, val) => {
      const box = el('div', '', 'card');
      box.appendChild(el('div', label, 'muted'));
      box.appendChild(el('div', val !== undefined && val !== null ? String(val) : 'NO DATA', 'value mono'));
      kpis.appendChild(box);
    };
    addKpi('Mean CPU %', modelData.mean_cpu_pct);
    addKpi('Max CPU %', modelData.max_cpu_pct);
    addKpi('Mean Memory MB', modelData.mean_memory_mb);
    addKpi('Max Memory MB', modelData.max_memory_mb);
    modelCard.appendChild(kpis);
  }
  container.appendChild(modelCard);

  // Full COST_PER_TIER.md verbatim view
  const mdCard = el('section', '', 'card');
  mdCard.appendChild(el('h2', 'Docker Final-Tier Cost Study Document (COST_PER_TIER.md)'));
  if (costTierRes && costTierRes.body) {
    mdCard.appendChild(makeBadgeRow(costTierRes.body));
    if (costTierRes.body.data && typeof costTierRes.body.data.text === 'string') {
      mdCard.appendChild(el('pre', costTierRes.body.data.text, 'md-view'));
    } else {
      mdCard.appendChild(el('p', costTierRes.body.empty || 'NO DATA', 'muted'));
    }
  } else {
    mdCard.appendChild(el('p', 'NO DATA · Document unavailable.', 'muted'));
  }
  container.appendChild(mdCard);

  content.replaceChildren(container);
}

// -------------------------------------------------------------
// d. Session Timeline
// -------------------------------------------------------------
async function initSession() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading session list and recorded decisions...', 'muted'));

  let sessionsRes;
  try {
    sessionsRes = await fetchJson('/api/sessions');
  } catch (e) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · /api/sessions endpoint unavailable.', 'card'));
    return;
  }

  const sBody = sessionsRes.body;
  const sMeta = sBody ? (sBody.metadata || { scope: sBody.source, policy_profile: 'UNKNOWN' }) : null;
  setBanner(sMeta);
  setStatus('Loaded sessions');

  const container = el('div');
  const sessions = (sBody && Array.isArray(sBody.sessions)) ? sBody.sessions : [];

  const grid = el('div', '', 'grid-2');
  const listCard = el('section', '', 'card');
  listCard.appendChild(el('h2', 'Recorded Sessions'));

  const tools = el('div', '', 'tools');
  const searchInput = document.createElement('input');
  searchInput.placeholder = 'Search masked session or visitor ID...';
  searchInput.setAttribute('aria-label', 'Search sessions');
  tools.appendChild(searchInput);

  const filterSelect = document.createElement('select');
  filterSelect.setAttribute('aria-label', 'Filter sessions by tier');
  const optAll = el('option', 'All sessions'); optAll.value = 'all';
  const optEsc = el('option', 'Reached T2+'); optEsc.value = 'yes';
  const optT1 = el('option', 'T1 only'); optT1.value = 'no';
  filterSelect.append(optAll, optEsc, optT1);
  tools.appendChild(filterSelect);
  listCard.appendChild(tools);

  const listWrap = el('div', '', 'scroll');
  listCard.appendChild(listWrap);

  const timelineCard = el('section', '', 'card');
  timelineCard.appendChild(el('h2', 'Ordered Decision Timeline'));
  const timelineMeta = el('div', '', 'muted');
  timelineMeta.appendChild(el('p', 'Select a session to inspect its ordered stage decision sequence.'));
  const timelineBody = el('div');
  timelineCard.append(timelineMeta, timelineBody);

  let activeSessionId = null;
  let queryText = '';
  let tierFilter = 'all';

  async function loadTimeline(sessionId) {
    activeSessionId = sessionId;
    renderSessionList();
    timelineMeta.replaceChildren(el('p', `Loading session ${sessionId}...`, 'muted'));
    timelineBody.replaceChildren();

    try {
      const res = await fetchJson(`/api/session/${encodeURIComponent(sessionId)}`);
      const payload = res.body;
      setBanner(payload);
      timelineMeta.replaceChildren();

      if (!res.ok || !payload || !payload.data || !Array.isArray(payload.data.decisions)) {
        timelineMeta.appendChild(el('h3', sessionId, 'mono'));
        if (payload) timelineMeta.appendChild(makeBadgeRow(payload));
        timelineBody.replaceChildren(el('p', payload.empty || 'NO DATA · Unknown session or no decisions recorded.', 'muted'));
        return;
      }

      const dData = payload.data;
      timelineMeta.appendChild(el('h3', dData.session_id, 'mono'));
      timelineMeta.appendChild(makeBadgeRow(payload));

      const decisions = dData.decisions;
      if (!decisions.length) {
        timelineBody.replaceChildren(el('p', 'NO DATA · No decision rows recorded for this session.', 'muted'));
        return;
      }

      const timelineWrap = el('div', '', 'timeline');
      let previousTier = null;
      for (let i = 0; i < decisions.length; i++) {
        const d = decisions[i];
        const isTierChange = previousTier !== null && d.tier_decided && d.tier_decided !== previousTier;
        previousTier = d.tier_decided || previousTier;

        const step = el('div', '', 'timeline-step' + (isTierChange ? ' tier-transition' : ''));
        const head = el('div', '', 'tools');
        head.appendChild(el('strong', `Step ${i + 1}: Stage ${d.stage || '—'}`));
        head.appendChild(el('span', d.tier_decided || '—', `badge ${d.tier_decided || ''}`));
        if (isTierChange) {
          head.appendChild(el('span', 'Tier Changed ↑', 'badge warn'));
        }
        if (d.demo_label) head.appendChild(el('span', d.demo_label, 'badge warn'));
        step.appendChild(head);

        const details = el('div', '', 'muted');
        const scoreText = d.score !== undefined && d.score !== null ? `score ${d.score}` : 'no score';
        const sourceText = d.score_source ? `source: ${d.score_source}` : '';
        const latText = d.latency_ms !== undefined && d.latency_ms !== null
          ? `${Number(d.latency_ms).toFixed(3)} ms (engine compute time, not end-to-end)`
          : 'latency unavailable';
        details.appendChild(el('div', `${scoreText} · ${sourceText}`));
        details.appendChild(el('div', `Provenance: ${d.provenance || 'UNKNOWN'} · Policy: ${d.policy_profile || 'UNKNOWN'}`));
        details.appendChild(el('div', latText));
        if (d.timestamp) details.appendChild(el('div', `Timestamp: ${d.timestamp}`, 'mono'));
        step.appendChild(details);
        timelineWrap.appendChild(step);
      }
      timelineBody.replaceChildren(timelineWrap);
    } catch (e) {
      timelineMeta.replaceChildren(el('p', 'NO DATA · Failed to load session timeline.', 'muted'));
      timelineBody.replaceChildren();
    }
  }

  function renderSessionList() {
    listWrap.replaceChildren();
    const q = queryText.trim().toLowerCase();
    const filtered = sessions.filter((s) => {
      const matchText = `${s.session_id} ${s.visitor_id}`.toLowerCase().includes(q);
      const matchTier = tierFilter === 'all' || (tierFilter === 'yes' ? s.reached_t2 : !s.reached_t2);
      return matchText && matchTier;
    });

    if (!filtered.length) {
      listWrap.appendChild(el('p', sessions.length ? 'No matching sessions.' : 'NO DATA · No sessions recorded in database.', 'muted'));
      return;
    }

    for (const s of filtered) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn' + (activeSessionId === s.session_id ? ' selected' : '');

      const idLine = el('div', s.session_id, 'mono');
      btn.appendChild(idLine);

      const subLine = el('div', `Visitor: ${s.visitor_id}${s.returning_visitor ? ' (Returning)' : ''}`, 'muted mono');
      btn.appendChild(subLine);

      const stageLine = el('div', '', 'tools');
      for (const st of ['S1', 'S2', 'S3', 'S4', 'S5']) {
        const tier = s.stages && s.stages[st];
        stageLine.appendChild(el('span', `${st}:${tier || '—'}`, `badge ${tier || ''}`));
      }
      btn.appendChild(stageLine);

      btn.addEventListener('click', () => loadTimeline(s.session_id));
      listWrap.appendChild(btn);
    }
  }

  searchInput.addEventListener('input', () => {
    queryText = searchInput.value;
    renderSessionList();
  });

  filterSelect.addEventListener('change', () => {
    tierFilter = filterSelect.value;
    renderSessionList();
  });

  renderSessionList();
  grid.append(listCard, timelineCard);
  container.appendChild(grid);
  content.replaceChildren(container);

  if (sessions.length > 0 && !activeSessionId) {
    loadTimeline(sessions[0].session_id);
  }
}

(function boot() {
  const path = window.location.pathname;
  for (const link of document.querySelectorAll('.topnav a')) {
    if (link.getAttribute('href') === path) link.classList.add('active');
  }
  if (path === '/evidence') initEvidence();
  else if (path === '/ml') initMl();
  else if (path === '/cost') initCost();
  else if (path === '/session') initSession();
})();
</script>
</body>
</html>
