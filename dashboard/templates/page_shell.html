<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Schrödinger's Server</title>
<style>
:root {
  color-scheme: dark;
  --canvas: #0B141B;
  --surface: #14232C;
  --surface-elevated: #1B2D35;
  --surface-inset: #101D25;

  --border-subtle: #2B4048;
  --border-strong: #3E5B66;
  --border-focus: #87C6B9;

  --text-primary: #F0F3EF;
  --text-secondary: #A5B6BA;
  --text-tertiary: #7C9297;

  --sea-glass: #87C6B9;
  --soft-brass: #D6B48D;
  --muted-coral: #D88D81;
  --research-lavender: #9A9BCF;

  --t1: #BCE8DC;
  --t2: #E7C7A7;

  --success: #9ACBB2;
  --warning: #E7CDA0;
  --invalid: #E8ABA6;

  --t1-surface: #163336;
  --t1-border: #2B575B;
  --t2-surface: #38281F;
  --t2-border: #634735;
  --t3-surface: #2E253B;
  --t3-border: #524268;

  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--canvas);
  color: var(--text-primary);
}
* { box-sizing: border-box; }
*:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}
body {
  margin: 0;
  padding: 14px;
  line-height: 1.55;
  min-width: 320px;
}
@media (min-width: 768px) {
  body { padding: 24px; }
}
a { color: var(--accent-seaglass); text-decoration: none; }
a:hover { text-decoration: underline; }
.topnav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.topnav a {
  padding: 7px 13px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  background: var(--surface-inset);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: background .15s, border-color .15s, color .15s;
}
.topnav a:hover {
  background: var(--surface-elevated);
  border-color: var(--border-focus);
  color: var(--text-primary);
  text-decoration: none;
}
.topnav a.active {
  background: var(--surface-elevated);
  border-color: var(--border-focus);
  color: var(--accent-seaglass);
}
header.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
h1 { font-size: 24px; margin: 0; font-weight: 700; letter-spacing: -0.025em; }
h2 { font-size: 17px; margin: 0 0 10px 0; font-weight: 600; }
h3 { font-size: 14px; margin: 0 0 8px 0; font-weight: 600; }
.muted { color: var(--text-secondary); font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
#banner {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 18px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
#banner.warn {
  background: #3d2812;
  border: 2px solid #fb923c;
  color: #fed7aa;
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 16px;
}
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
}
.grid-forensics {
  display: grid;
  grid-template-columns: 310px 1.25fr 340px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1200px) {
  .grid-forensics {
    grid-template-columns: 290px 1fr;
  }
  .forensics-inspector {
    grid-column: span 2;
  }
}
@media (max-width: 768px) {
  .grid-forensics {
    grid-template-columns: 1fr;
  }
  .forensics-inspector {
    grid-column: span 1;
  }
}
.context-inspector-panel {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 16px;
  position: sticky;
  top: 16px;
}
.timeline-step.selected {
  outline: 2px solid var(--border-focus);
  background: var(--surface-elevated);
}
.timeline-step {
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.timeline-step:hover {
  background: var(--surface-elevated);
}
.constellation-wrap {
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  background: var(--surface-inset);
  padding: 12px;
  margin-top: 12px;
  overflow: hidden;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
.card.warn {
  border-color: #fb923c;
  background: #23180f;
}
.card.highlight {
  border-color: var(--accent-seaglass);
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpi-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-value { font-size: 24px; font-weight: 700; margin: 4px 0 2px 0; font-family: ui-monospace, monospace; }
.kpi-sub { font-size: 12px; color: var(--text-tertiary); }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  margin: 2px 4px 2px 0;
  font-size: 11px;
  font-weight: 600;
  font-family: ui-monospace, monospace;
  border: 1px solid var(--border-subtle);
  background: var(--surface-inset);
}
.badge.done { background: #133327; color: #a3e6cd; border-color: #27634c; }
.badge.exploratory { background: #153243; color: #bde0fe; border-color: #265573; }
.badge.invalid { background: #3b171c; color: #fca5a5; border-color: #7f232e; }
.badge.inconclusive, .badge.warn { background: #3d2812; color: #fed7aa; border-color: #fb923c; }
.badge.T1 { background: var(--t1-surface); color: var(--t1-text); border-color: var(--t1-border); }
.badge.T2 { background: var(--t2-surface); color: var(--t2-text); border-color: var(--t2-border); }
.badge.T3 { background: var(--t3-surface); color: var(--t3-text); border-color: var(--t3-border); }
.tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 12px;
}
input, select {
  font: inherit;
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface-inset);
  color: var(--text-primary);
  font-size: 13px;
}
input { min-width: 220px; }
button {
  font: inherit;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface-inset);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 12px;
  transition: background .15s, border-color .15s;
}
button:hover {
  background: var(--surface-elevated);
  border-color: var(--border-focus);
}
button.active-filter {
  background: var(--surface-elevated);
  border-color: var(--accent-seaglass);
  color: var(--accent-seaglass);
  font-weight: 600;
}
.scroll {
  overflow-x: auto;
  max-width: 100%;
  max-height: 520px;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  position: sticky;
  top: 0;
  background: var(--surface-elevated);
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-strong);
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: var(--text-secondary);
  z-index: 2;
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}
tr:hover { background: rgba(135, 198, 185, 0.04); }
.item-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  background: var(--surface-inset);
  color: var(--text-primary);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.item-btn:hover {
  border-color: var(--border-strong);
  background: var(--surface-elevated);
}
.item-btn.selected {
  border-color: var(--border-focus);
  background: #152c33;
}
pre.md-view {
  background: var(--surface-inset);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 14px;
  overflow: auto;
  max-height: 480px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 1.5;
  margin: 0;
}
.tree details { margin-left: 12px; margin-top: 4px; }
.tree summary { cursor: pointer; font-weight: 600; color: var(--accent-seaglass); }
.tree-leaf {
  margin-left: 12px;
  padding: 3px 0;
  font-family: ui-monospace, monospace;
  font-size: 12px;
}
.timeline {
  border-left: 2px solid var(--border-strong);
  padding-left: 18px;
  margin-left: 10px;
  position: relative;
}
.timeline-step {
  position: relative;
  margin-bottom: 16px;
  background: var(--surface-inset);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px;
}
.timeline-step::before {
  content: '';
  position: absolute;
  left: -25px;
  top: 16px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent-seaglass);
  border: 2px solid var(--canvas);
}
.timeline-step.tier-transition::before {
  background: var(--accent-brass);
  box-shadow: 0 0 8px var(--accent-brass);
}
.timeline-step.tier-transition {
  border-color: var(--accent-brass);
  background: #231b14;
}
svg.chart {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.chart-bar {
  transition: opacity .15s;
}
.chart-bar:hover {
  opacity: 0.8;
}
footer.page-foot {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-tertiary);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  font-family: ui-monospace, monospace;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
@media print {
  body { background: #fff; color: #000; }
  .topnav, #banner { display: none; }
  .card { border: 1px solid #ccc; background: #fff; color: #000; }
}
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.card, .grid-2 > * { min-width: 0; }
.tools { max-width: 100%; overflow-x: auto; }
</style>
</head>
<body>
<nav class="topnav" aria-label="Dashboard">{{primary}}</nav>

<main>
  <header class="page-head">
    <div>
      <div class="muted mono" style="font-size: 11px; letter-spacing: 0.05em;">SCHRÖDINGER'S SERVER · RESEARCH OBSERVATORY</div>
      <h1>{{title}}</h1>
    </div>
    <div id="page-status" class="muted mono" role="status" aria-live="polite">NO DATA · waiting for API</div>
  </header>
  <p id="banner">Scope UNKNOWN · Policy profile UNKNOWN</p>
  <div id="content" aria-live="polite">NO DATA · No evidence loaded.</div>
</main>

<footer class="page-foot">
  <nav aria-label="Evidence &amp; Proof"><strong>Evidence &amp; Proof</strong> {{secondary}}</nav>
  <div id="foot-left">SCHRÖDINGER'S SERVER &bull; RESEARCH DEFENSE ARTIFACT</div>
  <div id="foot-right">Scope: UNKNOWN &bull; Profile: UNKNOWN &bull; Mode: Loopback</div>
</footer>

<script>
'use strict';

const el = (tag, textValue = '', cls = '') => {
  const node = document.createElement(tag);
  if (textValue !== null && textValue !== undefined && textValue !== '') {
    node.textContent = String(textValue);
  }
  if (cls) node.className = cls;
  return node;
};

const statusClass = (s) => {
  const v = String(s || '').toUpperCase();
  if (v === 'DONE' || v === 'RECORDED') return 'badge done';
  if (v === 'EXPLORATORY') return 'badge exploratory';
  if (v === 'INVALID') return 'badge invalid';
  if (v === 'NOT RUN' || v === 'INCONCLUSIVE') return 'badge inconclusive';
  return 'badge';
};

function updateFooter(meta) {
  const right = document.getElementById('foot-right');
  if (!right) return;
  const scope = (meta && meta.scope) ? meta.scope : 'UNKNOWN';
  const profile = (meta && meta.policy_profile) ? meta.policy_profile : 'UNKNOWN';
  right.textContent = `Scope: ${scope} • Profile: ${profile} • Mode: Loopback`;
}

function setBanner(meta, extraWarnText = '') {
  const banner = document.getElementById('banner');
  const scope = (meta && meta.scope) ? meta.scope : 'UNKNOWN';
  const profile = (meta && meta.policy_profile) ? meta.policy_profile : 'UNKNOWN';
  const parts = [`Scope ${scope}`, `Policy profile ${profile}`];
  if (meta && meta.demo_label) parts.push(meta.demo_label);
  if (meta && meta.status) parts.push(`Status ${meta.status}`);
  if (meta && meta.source_file) parts.push(`Source ${meta.source_file}`);
  if (extraWarnText) {
    parts.push(extraWarnText);
    banner.className = 'warn';
  } else if (meta && (meta.demo_label || ['badge invalid', 'badge inconclusive'].includes(statusClass(meta.status)))) {
    banner.className = 'warn';
  } else {
    banner.className = '';
  }
  banner.textContent = parts.join(' · ');
  updateFooter(meta);
}

function setStatus(msg) {
  const st = document.getElementById('page-status');
  if (st) st.textContent = msg;
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(8000) });
  const body = await res.json();
  return { ok: res.ok, status: res.status, body };
}

function renderJsonTree(value, keyLabel = null) {
  if (value === null || typeof value !== 'object') {
    const row = el('div', '', 'tree-leaf');
    if (keyLabel !== null) {
      const k = el('span', keyLabel + ': ', 'muted');
      row.appendChild(k);
    }
    row.appendChild(el('span', value === null ? 'null' : String(value)));
    return row;
  }
  const details = document.createElement('details');
  details.open = keyLabel === null;
  const isArr = Array.isArray(value);
  const keys = Object.keys(value);
  const label = keyLabel !== null
    ? `${keyLabel} (${isArr ? value.length + ' items' : keys.length + ' keys'})`
    : (isArr ? `Array (${value.length})` : `Object (${keys.length})`);
  details.appendChild(el('summary', label));
  for (const k of keys) {
    details.appendChild(renderJsonTree(value[k], k));
  }
  return details;
}

function makeBadgeRow(meta) {
  const wrap = el('div');
  const seen = new Set();
  if (meta.scope) wrap.appendChild(el('span', `Scope: ${meta.scope}`, 'badge'));
  if (meta.status) wrap.appendChild(el('span', meta.status, statusClass(meta.status)));
  if (meta.policy_profile) {
    wrap.appendChild(el('span', `Profile: ${meta.policy_profile}`, 'badge'));
    seen.add(meta.policy_profile);
  }
  if (meta.demo_label && !seen.has(meta.demo_label)) {
    wrap.appendChild(el('span', meta.demo_label, 'badge warn'));
    seen.add(meta.demo_label);
  }
  if (meta.source_file) wrap.appendChild(el('span', meta.source_file, 'badge mono'));
  return wrap;
}

function makeCopyButton(textToCopy, label = 'Copy') {
  const btn = el('button', label);
  btn.type = 'button';
  btn.style.marginLeft = '8px';
  btn.style.fontSize = '11px';
  btn.style.padding = '3px 8px';
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(textToCopy);
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = label; }, 1500);
    } catch (e) {
      btn.textContent = 'Failed';
    }
  });
  return btn;
}

// =============================================================
// 1. Evidence Vault (/evidence)
// =============================================================
async function initEvidence() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading evidence index and progress...', 'muted mono'));
  let idxRes, progRes;
  try {
    [idxRes, progRes] = await Promise.all([
      fetchJson('/api/evidence/index'),
      fetchJson('/api/progress')
    ]);
  } catch (e) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · Failed to reach evidence endpoints.', 'card'));
    return;
  }

  const idx = idxRes.body;
  setBanner(idx);
  setStatus(`Loaded ${idx.items ? idx.items.length : 0} evidence items`);

  const container = el('div');

  // Evidence Index + Detail Drawer
  const grid = el('div', '', 'grid-2');
  const listCard = el('section', '', 'card');
  listCard.appendChild(el('h2', 'Allowlisted Research Evidence Catalog'));
  const items = (idx && Array.isArray(idx.items)) ? idx.items : [];
  if (!items.length) {
    listCard.appendChild(el('p', idx.empty || 'NO DATA · No evidence items indexed.', 'muted'));
    grid.appendChild(listCard);
    container.appendChild(grid);
    content.replaceChildren(container);
    return;
  }

  let activeStatusFilter = 'ALL';
  let activeKindFilter = 'ALL';
  let sortField = 'title';
  let searchText = '';
  let selectedId = null;

  const tools = el('div', '', 'tools');
  const searchInput = document.createElement('input');
  searchInput.placeholder = 'Search by ID, title, or source path...';
  searchInput.setAttribute('aria-label', 'Filter evidence');
  tools.appendChild(searchInput);

  const sortSelect = document.createElement('select');
  sortSelect.setAttribute('aria-label', 'Sort evidence items');
  const sortTitle = el('option', 'Sort by Title'); sortTitle.value = 'title';
  const sortStatus = el('option', 'Sort by Status'); sortStatus.value = 'status';
  const sortKind = el('option', 'Sort by Kind'); sortKind.value = 'kind';
  sortSelect.append(sortTitle, sortStatus, sortKind);
  sortSelect.addEventListener('change', () => {
    sortField = sortSelect.value;
    renderList();
  });
  tools.appendChild(sortSelect);

  // Status filter chips
  const filterStatuses = ['ALL', ...new Set(items.map(item => item.status))];
  const statusFilterBtns = [];
  for (const fs of filterStatuses) {
    const btn = el('button', fs === 'ALL' ? 'All Status' : fs, fs === 'ALL' ? 'active-filter' : '');
    btn.type = 'button';
    btn.addEventListener('click', () => {
      activeStatusFilter = fs;
      for (const b of statusFilterBtns) b.className = (b === btn) ? 'active-filter' : '';
      renderList();
    });
    statusFilterBtns.push(btn);
    tools.appendChild(btn);
  }

  const divider = el('span', '|', 'muted');
  divider.style.margin = '0 6px';
  divider.style.userSelect = 'none';
  tools.appendChild(divider);

  // Kind filter chips (All, JSON, Markdown)
  const filterKinds = ['ALL', 'json', 'markdown'];
  const kindFilterBtns = [];
  for (const fk of filterKinds) {
    const btn = el('button', fk === 'ALL' ? 'All Kinds' : fk.toUpperCase(), fk === 'ALL' ? 'active-filter' : '');
    btn.type = 'button';
    btn.addEventListener('click', () => {
      activeKindFilter = fk;
      for (const b of kindFilterBtns) b.className = (b === btn) ? 'active-filter' : '';
      renderList();
    });
    kindFilterBtns.push(btn);
    tools.appendChild(btn);
  }

  listCard.appendChild(tools);
  const listWrap = el('div', '', 'scroll');
  listCard.appendChild(listWrap);

  const inspectorCard = el('section', '', 'card');
  inspectorCard.appendChild(el('h2', 'Evidence Inspector & Payload Viewer'));
  const inspectorMeta = el('div', '', 'muted');
  inspectorMeta.appendChild(el('p', 'Select an evidence item from the catalog to inspect verified raw contents.'));
  const inspectorBody = el('div');
  inspectorCard.append(inspectorMeta, inspectorBody);

  async function inspectItem(item) {
    selectedId = item.id;
    renderList();
    inspectorMeta.replaceChildren(el('p', `Loading ${item.id}...`, 'muted mono'));
    inspectorBody.replaceChildren();

    try {
      const res = await fetchJson(`/api/evidence/${encodeURIComponent(item.id)}`);
      const payload = res.body;
      inspectorMeta.replaceChildren();
      const topTitleRow = el('div', '', 'tools');
      topTitleRow.appendChild(el('h3', payload.title || item.id));
      if (payload.source_file) {
        topTitleRow.appendChild(makeCopyButton(payload.source_file, 'Copy Source Path'));
      }
      inspectorMeta.appendChild(topTitleRow);
      inspectorMeta.appendChild(makeBadgeRow(payload));

      if (!res.ok || payload.data === null || payload.data === undefined) {
        inspectorBody.replaceChildren(el('p', payload.empty || 'NO DATA · Evidence unavailable.', 'muted mono'));
        return;
      }

      if (payload.kind === 'markdown') {
        const copyMdBtn = makeCopyButton(payload.data.text || '', 'Copy Markdown Text');
        inspectorBody.appendChild(copyMdBtn);
        const pre = el('pre', payload.data.text || '', 'md-view');
        pre.style.marginTop = '10px';
        inspectorBody.appendChild(pre);
      } else {
        const copyJsonBtn = makeCopyButton(JSON.stringify(payload.data, null, 2), 'Copy JSON Payload');
        inspectorBody.appendChild(copyJsonBtn);
        const treeWrap = el('div', '', 'tree scroll');
        treeWrap.style.marginTop = '10px';
        treeWrap.appendChild(renderJsonTree(payload.data));
        inspectorBody.appendChild(treeWrap);
      }
    } catch (e) {
      inspectorMeta.replaceChildren(el('p', 'NO DATA · Failed to load evidence item.', 'muted mono'));
      inspectorBody.replaceChildren();
    }
  }

  function renderList() {
    listWrap.replaceChildren();
    const q = searchText.trim().toLowerCase();
    const filtered = items.filter((it) => {
      if (activeStatusFilter !== 'ALL' && String(it.status).toUpperCase() !== activeStatusFilter.toUpperCase()) return false;
      if (activeKindFilter !== 'ALL' && it.kind !== activeKindFilter) return false;
      if (!q) return true;
      return `${it.id} ${it.title} ${it.source_file}`.toLowerCase().includes(q);
    });

    filtered.sort((a, b) => {
      if (sortField === 'status') return String(a.status).localeCompare(String(b.status));
      if (sortField === 'kind') return String(a.kind).localeCompare(String(b.kind));
      return String(a.title || a.id).localeCompare(String(b.title || b.id));
    });

    if (!filtered.length) {
      listWrap.appendChild(el('p', 'No matching evidence items found.', 'muted'));
      return;
    }

    for (const it of filtered) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn' + (selectedId === it.id ? ' selected' : '');
      const headRow = el('div', '', 'tools');
      headRow.appendChild(el('strong', it.title || it.id));
      headRow.appendChild(el('span', (it.kind || 'json').toUpperCase(), 'badge mono'));
      btn.append(headRow, makeBadgeRow(it));
      btn.addEventListener('click', () => inspectItem(it));
      listWrap.appendChild(btn);
    }
  }

  searchInput.addEventListener('input', () => {
    searchText = searchInput.value;
    renderList();
  });

  renderList();
  grid.append(listCard, inspectorCard);
  container.appendChild(grid);
  content.replaceChildren(container);

  if (items.length > 0) {
    inspectItem(items[0]);
  }
}

async function initCost() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading matched resource measurements and cost study...', 'muted mono'));
  const settled = await Promise.allSettled([
    fetchJson('/api/evidence/COST_PER_TIER'),

  ]);

  const getBody = (idx) => (settled[idx].status === 'fulfilled' ? settled[idx].value : null);
  const costTierRes = getBody(0);
  const t1Res = getBody(1);
  const t2Res = getBody(2);
  const modelRes = getBody(3);
  const probeRes = getBody(4);

  const costMeta = costTierRes ? costTierRes.body : (t1Res ? t1Res.body : null);
  setBanner(costMeta);
  if (!costTierRes && !t1Res && !t2Res && !modelRes) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · Cost endpoints unavailable.', 'card'));
    return;
  }
  setStatus('Loaded resource measurements and cost study');

  const container = el('div');

  // Mandatory verbatim limitation callout from COST_PER_TIER
  const limitCard = el('section', '', 'card warn');
  limitCard.appendChild(el('h2', 'Matched Laboratory Methodology & Confounding Limitation'));
  let matchedParagraph = 'NO DATA';
  if (costTierRes && costTierRes.body && costTierRes.body.data && typeof costTierRes.body.data.text === 'string') {
    const rawText = costTierRes.body.data.text;
    const parts = rawText.split(/\r?\n\r?\n/);
    const found = parts.find((p) => p.trim().startsWith('Matched session count'));
    if (found) matchedParagraph = found.trim();
  }
  limitCard.appendChild(el('p', matchedParagraph));
  if (costTierRes && costTierRes.body) limitCard.appendChild(makeBadgeRow(costTierRes.body));
  container.appendChild(limitCard);

  // Range-Bar Visuals with DYNAMIC scale (no fixed 20% cap)
  const t1Runs = (t1Res && t1Res.body && t1Res.body.data && Array.isArray(t1Res.body.data.runs)) ? t1Res.body.data.runs : [];
  const t2Runs = (t2Res && t2Res.body && t2Res.body.data && Array.isArray(t2Res.body.data.runs)) ? t2Res.body.data.runs : [];

  if (t1Runs.length || t2Runs.length) {
    const rangeCard = el('section', '', 'card');
    rangeCard.appendChild(el('h2', 'Resource Spread by Repeat (Min-Max Range Bars)'));
    rangeCard.appendChild(el('p', 'Visualizing mean and max CPU percentage across repeated runs with dynamically bounded chart scale.', 'muted'));

    const allRuns = [
      ...t1Runs.map((r) => ({ target: 'T1', ...r })),
      ...t2Runs.map((r) => ({ target: 'T2', ...r }))
    ].filter(r => Number.isFinite(r.stats?.mean_cpu_pct) && Number.isFinite(r.stats?.max_cpu_pct));

    let peakCpu = 0;
    for (const r of allRuns) {
      const c = r.stats.max_cpu_pct;
      if (c > peakCpu) peakCpu = c;
    }
    const maxCpu = Math.max(peakCpu * 1.25, 2.5);

    const rangeWrap = el('div', '', 'scroll');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 620 220');
    svg.setAttribute('class', 'chart');
    svg.style.maxHeight = '220px';

    const chartH = 140;
    const chartW = 520;
    const startX = 65;
    const startY = 25;

    // Grid lines
    for (let i = 0; i <= 4; i++) {
      const val = (maxCpu * i) / 4;
      const y = startY + chartH - (val / maxCpu) * chartH;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', String(startX));
      line.setAttribute('x2', String(startX + chartW));
      line.setAttribute('y1', String(y));
      line.setAttribute('y2', String(y));
      line.setAttribute('stroke', '#2B4048');
      svg.appendChild(line);

      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', String(startX - 8));
      txt.setAttribute('y', String(y + 4));
      txt.setAttribute('text-anchor', 'end');
      txt.setAttribute('fill', '#A5B6BA');
      txt.setAttribute('font-size', '10');
      txt.setAttribute('font-family', 'ui-monospace');
      txt.textContent = `${val.toFixed(2)}%`;
      svg.appendChild(txt);
    }

    const slotW = Math.floor(chartW / (allRuns.length || 1));
    for (let i = 0; i < allRuns.length; i++) {
      const r = allRuns[i];
      const meanCpu = r.stats.mean_cpu_pct;
      const maxC = r.stats.max_cpu_pct;
      const x = startX + i * slotW + slotW / 2;

      const yMax = startY + chartH - Math.min(chartH, (maxC / maxCpu) * chartH);
      const yMean = startY + chartH - Math.min(chartH, (meanCpu / maxCpu) * chartH);

      const whisker = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      whisker.setAttribute('x1', String(x));
      whisker.setAttribute('x2', String(x));
      whisker.setAttribute('y1', String(yMax));
      whisker.setAttribute('y2', String(startY + chartH));
      whisker.setAttribute('stroke', r.target === 'T1' ? '#87C6B9' : '#D6B48D');
      whisker.setAttribute('stroke-width', '3');
      svg.appendChild(whisker);

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', String(x));
      dot.setAttribute('cy', String(yMean));
      dot.setAttribute('r', '4');
      dot.setAttribute('fill', '#fff');
      svg.appendChild(dot);

      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', String(x));
      lbl.setAttribute('y', String(startY + chartH + 16));
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('fill', '#A5B6BA');
      lbl.setAttribute('font-size', '9');
      lbl.setAttribute('font-family', 'ui-monospace');
      lbl.textContent = `${r.target}-R${r.repeat}`;
      svg.appendChild(lbl);
    }

    rangeWrap.appendChild(svg);
    rangeCard.appendChild(rangeWrap);
    container.appendChild(rangeCard);
  }

  // Matched Measurements Table (T1 vs T2)
  const measCard = el('section', '', 'card');
  measCard.appendChild(el('h2', 'Matched Hardware Resource Measurements'));
  measCard.appendChild(el('p', 'Comparative CPU and memory observed across isolated pure runs (Spike S2 protocol).', 'muted'));

  if (!t1Runs.length && !t2Runs.length) {
    measCard.appendChild(el('p', 'NO DATA · Pure tier measurements unavailable.', 'muted mono'));
  } else {
    const tbl = el('table');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['Target Tier', 'Repeat', 'Wall Time (s)', 'Mean CPU %', 'Max CPU %', 'Mean MB', 'Max MB']) {
      htr.appendChild(el('th', h));
    }
    thead.appendChild(htr);
    const tbody = el('tbody');

    const addRunRows = (target, runs) => {
      for (const r of runs) {
        const tr = el('tr');
        const st = r.stats || {};
        tr.appendChild(el('td', target, 'mono'));
        tr.appendChild(el('td', String(r.repeat || ''), 'mono'));
        tr.appendChild(el('td', st.wall_time !== undefined ? String(st.wall_time) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.mean_cpu_pct !== undefined ? String(st.mean_cpu_pct) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.max_cpu_pct !== undefined ? String(st.max_cpu_pct) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.mean_memory_mb !== undefined ? String(st.mean_memory_mb) : 'NO DATA', 'mono'));
        tr.appendChild(el('td', st.max_memory_mb !== undefined ? String(st.max_memory_mb) : 'NO DATA', 'mono'));
        tbody.appendChild(tr);
      }
    };
    addRunRows('T1', t1Runs);
    addRunRows('T2', t2Runs);
    tbl.append(thead, tbody);
    measCard.appendChild(el('div', '', 'scroll')).appendChild(tbl);
  }
  container.appendChild(measCard);

  content.replaceChildren(container);
}

// 4. Session Forensics (/session) — 3-Level Investigative Architecture
// =============================================================
const RULE_EXPLANATIONS = {
  'ml_model_s3': 'Logistic regression score.', // models/model_s3.json
  'rule_r7_decision_tree': 'Constant-score fallback labelled R7.' // gatekeeper/decision_api.py
};

async function initSession() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading recorded sessions and decision logs...', 'muted mono'));

  let sessRes;
  try {
    sessRes = await fetchJson('/api/sessions');
  } catch (e) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · Failed to load sessions list.', 'card'));
    return;
  }

  const sData = sessRes.body;
  setBanner(sData ? sData.metadata : null);
  const sessions = (sData && Array.isArray(sData.sessions)) ? sData.sessions : [];
  setStatus(`Loaded ${sessions.length} recorded sessions`);

  const container = el('div');
  const grid = el('div', '', 'grid-forensics');

  // Level 1: Left — Session Navigator
  const listCard = el('section', '', 'card');
  listCard.appendChild(el('h2', 'Session Navigator'));

  let queryText = '';
  let tierFilter = 'all';
  let activeSessionId = null;

  const urlParamId = new URLSearchParams(window.location.search).get('id');

  const tools = el('div', '', 'tools');
  const searchInput = document.createElement('input');
  searchInput.placeholder = 'Search by session or visitor ID...';
  searchInput.value = queryText;
  searchInput.setAttribute('aria-label', 'Filter sessions');
  tools.appendChild(searchInput);

  const filterSelect = document.createElement('select');
  filterSelect.setAttribute('aria-label', 'Filter by escalation');
  const optAll = el('option', 'All Sessions'); optAll.value = 'all';
  const optYes = el('option', 'Reached T2 (Escalated)'); optYes.value = 'yes';
  const optNo = el('option', 'T1 Only (Unescalated)'); optNo.value = 'no';
  filterSelect.append(optAll, optYes, optNo);
  tools.appendChild(filterSelect);
  listCard.appendChild(tools);

  const listWrap = el('div', '', 'scroll');
  listCard.appendChild(listWrap);

  // Level 2: Center — Observation Timeline
  const timelineCard = el('section', '', 'card');
  timelineCard.appendChild(el('h2', 'Observation Timeline'));
  const timelineMeta = el('div', '', 'muted');
  timelineMeta.appendChild(el('p', 'Select a session from the left to inspect its complete recorded decision trajectory.'));
  const timelineBody = el('div');
  timelineCard.append(timelineMeta, timelineBody);

  // Level 3: Right — Context Inspector
  const inspectorCard = el('section', '', 'card forensics-inspector');
  inspectorCard.appendChild(el('h2', 'Context Inspector'));
  const inspectorBody = el('div');
  inspectorBody.appendChild(el('p', 'Click any stage decision in the timeline to inspect its recorded policy fields and rationale.', 'muted'));
  inspectorCard.appendChild(inspectorBody);

  function renderInspector(dec, isTransition, sessionMeta) {
    inspectorBody.replaceChildren();
    if (!dec) {
      inspectorBody.appendChild(el('p', 'Click any stage decision in the timeline to inspect its recorded policy fields and rationale.', 'muted'));
      return;
    }

    const tier = dec.tier_decided || dec.tier || 'T1';
    const stageName = `Stage ${dec.stage}`;

    const headRow = el('div', '', 'tools');
    headRow.appendChild(el('h3', `${stageName} Decision Context`));
    headRow.appendChild(el('span', tier, `badge ${tier}`));
    if (isTransition) {
      headRow.appendChild(el('span', 'Escalation Event (T1 → T2)', 'badge warn'));
    }
    inspectorBody.appendChild(headRow);

    // Rule explanation section
    const ruleBox = el('div', '', 'card');
    ruleBox.style.background = 'var(--surface-inset)';
    ruleBox.style.margin = '10px 0';
    ruleBox.style.padding = '12px';

    const sourceName = dec.score_source || 'UNKNOWN';
    ruleBox.appendChild(el('div', 'Decision Rule / Source:', 'muted mono'));
    const sourceTitle = el('strong', sourceName, 'mono');
    sourceTitle.style.color = 'var(--sea-glass)';
    ruleBox.appendChild(sourceTitle);

    const explanation = RULE_EXPLANATIONS[sourceName] ||
      sourceName;
    const expText = el('p', explanation);
    expText.style.margin = '6px 0 0 0';
    expText.style.fontSize = '13px';
    ruleBox.appendChild(expText);
    inspectorBody.appendChild(ruleBox);

    // Decision Fields Table
    const fieldsTable = el('table');
    const fTbody = el('tbody');

    const addRow = (label, value, isMono = true) => {
      const tr = el('tr');
      const th = el('td', label, 'muted');
      th.style.width = '120px';
      const td = el('td', String(value), isMono ? 'mono' : '');
      tr.append(th, td);
      fTbody.appendChild(tr);
    };

    addRow('Assigned Tier', tier);
    addRow('Evaluation Stage', stageName);
    addRow('Score Value', (dec.score !== undefined && dec.score !== null) ? dec.score : 'None');
    addRow('Policy Source', dec.score_source || 'UNKNOWN');

    const latVal = (dec.latency_ms !== undefined && dec.latency_ms !== null)
      ? `${Number(dec.latency_ms).toFixed(2)} ms`
      : 'NO DATA';
    addRow('Compute Latency', latVal);
    addRow('Provenance', dec.provenance || 'LAB');
    addRow('Policy Profile', dec.policy_profile || 'UNKNOWN');
    if (dec.timestamp) addRow('Event Timestamp', dec.timestamp);

    fieldsTable.appendChild(fTbody);
    inspectorBody.appendChild(fieldsTable);

    const latNotice = el('div', 'Latency Note: Engine compute latency measures isolated Gatekeeper policy calculation duration, excluding network transmission.', 'muted mono');
    latNotice.style.fontSize = '11px';
    latNotice.style.marginTop = '10px';
    inspectorBody.appendChild(latNotice);
  }

  async function loadTimeline(sessionId) {
    activeSessionId = sessionId;
    renderSessionList();
    timelineMeta.replaceChildren(el('p', `Loading decision log for ${sessionId}...`, 'muted mono'));
    timelineBody.replaceChildren();
    inspectorBody.replaceChildren(el('p', 'Loading decision context...', 'muted mono'));

    try {
      const res = await fetchJson(`/api/session/${encodeURIComponent(sessionId)}`);
      timelineMeta.replaceChildren();

      const sessMeta = sessions.find(x => x.session_id === sessionId) || {};
      const visitorId = sessMeta.visitor_id || 'UNKNOWN';
      const returningVisitor = sessMeta.returning_visitor || false;
      const sData = (res.body && res.body.data) ? res.body.data : res.body;

      const titleRow = el('div', '', 'tools');
      titleRow.appendChild(el('h3', sessionId));
      titleRow.appendChild(makeCopyButton(sessionId, 'Copy Session ID'));
      timelineMeta.appendChild(titleRow);

      const vLine = el('div', '', 'tools');
      const vLink = document.createElement('a');
      vLink.href = `/visitors?id=${encodeURIComponent(visitorId)}`;
      vLink.textContent = `Visitor: ${visitorId}`;
      vLink.className = 'mono';
      vLine.appendChild(vLink);
      if (returningVisitor) vLine.appendChild(el('span', 'Returning Visitor', 'badge done'));
      timelineMeta.appendChild(vLine);

      // Explicit data reality disclaimer
      const disclaim = el('div', '', 'card warn');
      disclaim.style.margin = '10px 0';
      disclaim.appendChild(el('strong', 'Evidence Reality Notice: '));
      disclaim.appendChild(el('span', 'Command-level evidence not available in this view. Recorded decisions reflect Gatekeeper policy engine evaluations only.'));
      timelineMeta.appendChild(disclaim);

      const decisions = (sData && Array.isArray(sData.decisions)) ? sData.decisions : [];
      if (!decisions.length) {
        timelineBody.replaceChildren(el('p', 'NO DATA · No decision rows recorded for this session.', 'muted mono'));
        inspectorBody.replaceChildren(el('p', 'No decisions available to inspect.', 'muted mono'));
        return;
      }

      const timelineWrap = el('div', '', 'timeline');
      let defaultSelectedStep = null;
      let defaultDecision = null;
      let defaultIsTransition = false;

      decisions.forEach((d, idx) => {
        const tier = d.tier_decided || d.tier || 'T1';
        const prevTier = idx > 0 ? (decisions[idx-1].tier_decided || decisions[idx-1].tier || 'T1') : null;
        const isTransition = prevTier !== null && prevTier !== tier && (tier === 'T2' || tier === 'T3');
        const step = el('div', '', 'timeline-step' + (isTransition ? ' tier-transition' : ''));

        const sRow = el('div', '', 'tools');
        sRow.appendChild(el('strong', `Stage ${d.stage}`));
        sRow.appendChild(el('span', tier, `badge ${tier}`));
        if (isTransition) {
          sRow.appendChild(el('span', `Escalation Event (${prevTier} → ${tier})`, 'badge warn'));
        }
        step.appendChild(sRow);

        const details = el('div', '', 'mono muted');
        details.style.marginTop = '6px';
        const scoreText = (d.score !== undefined && d.score !== null) ? `Score: ${d.score}` : 'Score: NO DATA';
        const sourceText = d.score_source ? `Source: ${d.score_source}` : 'Source: UNKNOWN';
        const latText = (d.latency_ms !== undefined && d.latency_ms !== null)
          ? `Latency: ${Number(d.latency_ms).toFixed(2)} ms`
          : 'Latency: NO DATA';

        details.appendChild(el('div', `${scoreText} · ${sourceText}`));
        details.appendChild(el('div', `Provenance: ${d.provenance || 'UNKNOWN'} · Policy: ${d.policy_profile || 'UNKNOWN'}`));
        details.appendChild(el('div', latText));
        if (d.timestamp) details.appendChild(el('div', `Timestamp: ${d.timestamp}`, 'mono'));
        step.appendChild(details);

        // Click to inspect
        step.addEventListener('click', () => {
          for (const c of timelineWrap.children) c.classList.remove('selected');
          step.classList.add('selected');
          renderInspector(d, isTransition, sessMeta);
        });

        if (isTransition || !defaultDecision) {
          defaultSelectedStep = step;
          defaultDecision = d;
          defaultIsTransition = isTransition;
        }

        timelineWrap.appendChild(step);
      });

      timelineBody.replaceChildren(timelineWrap);

      // Select default decision (escalated or first)
      if (defaultSelectedStep && defaultDecision) {
        defaultSelectedStep.classList.add('selected');
        renderInspector(defaultDecision, defaultIsTransition, sessMeta);
      }
    } catch (e) {
      timelineMeta.replaceChildren(el('p', 'NO DATA · Failed to load session timeline.', 'muted mono'));
      timelineBody.replaceChildren();
      inspectorBody.replaceChildren(el('p', 'NO DATA', 'muted mono'));
    }
  }

  function renderSessionList() {
    listWrap.replaceChildren();
    const q = queryText.trim().toLowerCase();
    const filtered = sessions.filter((s) => {
      const matchText = `${s.session_id} ${s.visitor_id}`.toLowerCase().includes(q);
      const matchTier = tierFilter === 'all' || (tierFilter === 'yes' ? s.reached_t2 : !s.reached_t2);
      return matchText && matchTier;
    });

    if (!filtered.length) {
      listWrap.appendChild(el('p', sessions.length ? 'No matching sessions found.' : 'NO DATA · No sessions recorded in database.', 'muted mono'));
      return;
    }

    for (const s of filtered) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item-btn' + (activeSessionId === s.session_id ? ' selected' : '');

      const idLine = el('div', s.session_id, 'mono');
      idLine.style.fontWeight = '600';
      btn.appendChild(idLine);

      const subLine = el('div', `Visitor: ${s.visitor_id}${s.returning_visitor ? ' (Returning)' : ''}`, 'muted mono');
      btn.appendChild(subLine);

      const stageLine = el('div', '', 'tools');
      stageLine.style.marginTop = '4px';
      if (s.stages && Object.keys(s.stages).length) {
        const stageOrder = { 'S1': 1, 'S2': 2, 'S3': 3, 'S4': 4, 'S5': 5 };
        const observedStages = Object.entries(s.stages).sort((a, b) => (stageOrder[a[0]] || 99) - (stageOrder[b[0]] || 99));
        for (const [st, tier] of observedStages) {
          stageLine.appendChild(el('span', `${st}:${tier}`, `badge ${tier}`));
        }
      } else {
        stageLine.appendChild(el('span', 'No stages observed', 'muted mono'));
      }
      btn.appendChild(stageLine);

      btn.addEventListener('click', () => loadTimeline(s.session_id));
      listWrap.appendChild(btn);
    }
  }

  searchInput.addEventListener('input', () => {
    queryText = searchInput.value;
    renderSessionList();
  });

  filterSelect.addEventListener('change', () => {
    tierFilter = filterSelect.value;
    renderSessionList();
  });

  renderSessionList();
  grid.append(listCard, timelineCard, inspectorCard);
  container.appendChild(grid);
  content.replaceChildren(container);

  if (activeSessionId) {
    loadTimeline(activeSessionId);
  } else if (sessions.length > 0) {
    loadTimeline(sessions[0].session_id);
  }
}

// 5. Visitor Atlas (/visitors)
// =============================================================
async function initVisitors() {
  const content = document.getElementById('content');
  content.replaceChildren(el('p', 'Loading visitor telemetry and grouped session trajectories...', 'muted mono'));

  let sessRes;
  try {
    sessRes = await fetchJson('/api/sessions');
  } catch (e) {
    setStatus('NO DATA · API unavailable');
    content.replaceChildren(el('div', 'NO DATA · Failed to load sessions for visitor clustering.', 'card'));
    return;
  }

  const sData = sessRes.body;
  setBanner(sData ? sData.metadata : null);
  const sessions = (sData && Array.isArray(sData.sessions)) ? sData.sessions : [];
  setStatus(`Loaded sessions for visitor clustering`);

  const container = el('div');

  // Group sessions by visitor_id
  const visitorMap = new Map();
  for (const s of sessions) {
    const vId = s.visitor_id || 'UNKNOWN';
    if (!visitorMap.has(vId)) {
      visitorMap.set(vId, {
        id: vId,
        sessions: [],
        returning: s.returning_visitor,
        stagesSeen: new Set(),
        escalated: false
      });
    }
    const vObj = visitorMap.get(vId);
    vObj.sessions.push(s);
    if (s.returning_visitor) vObj.returning = true;
    if (s.reached_t2) vObj.escalated = true;
    if (s.stages) {
      for (const [st, tr] of Object.entries(s.stages)) {
        if (tr) vObj.stagesSeen.add(`${st}:${tr}`);
      }
    }
  }

  const visitors = [...visitorMap.values()];
  const totalVisitors = visitors.length;
  const returningCount = visitors.filter(v => v.returning || v.sessions.length > 1).length;
  const singleCount = totalVisitors - returningCount;

  // KPI strip
  const kpis = el('section', '', 'kpis');
  const k1 = el('div', '', 'card');
  k1.appendChild(el('div', 'Total Masked Visitors', 'kpi-title'));
  k1.appendChild(el('div', String(totalVisitors), 'kpi-value'));
  k1.appendChild(el('div', 'Distinct pseudonymous clusters', 'kpi-sub'));

  const k2 = el('div', '', 'card');
  k2.appendChild(el('div', 'Recurring Visitors', 'kpi-title'));
  k2.appendChild(el('div', String(returningCount), 'kpi-value'));
  k2.appendChild(el('div', 'Appeared in >1 recorded session', 'kpi-sub'));

  const k3 = el('div', '', 'card');
  k3.appendChild(el('div', 'Single-Session Visitors', 'kpi-title'));
  k3.appendChild(el('div', String(singleCount), 'kpi-value'));
  k3.appendChild(el('div', 'Single observation trajectory', 'kpi-sub'));

  kpis.append(k1, k2, k3);
  container.appendChild(kpis);

  // Visitor Constellation Explorer Card
  let selectedVisitorId = new URLSearchParams(window.location.search).get('id') || (visitors.length ? visitors[0].id : null);

  const constellCard = el('section', '', 'card');
  constellCard.appendChild(el('h2', 'Visitor Observation Constellation'));
  const constellMeta = el('div', '', 'muted mono');
  const constellSvgWrap = el('div', '', 'constellation-wrap');
  constellCard.append(constellMeta, constellSvgWrap);
  container.appendChild(constellCard);

  function renderConstellation(vId) {
    selectedVisitorId = vId;
    const vObj = visitorMap.get(vId);
    if (!vObj) {
      constellMeta.textContent = 'Select a visitor profile below to inspect its session relationship constellation.';
      constellSvgWrap.replaceChildren(el('p', 'No visitor selected.', 'muted mono'));
      return;
    }

    constellMeta.textContent = `Active Cluster: ${vId} · Total Recorded Sessions: ${vObj.sessions.length}${vObj.returning ? ' (Recurring)' : ''}`;
    constellSvgWrap.replaceChildren();

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const w = 760;
    const sessCount = Math.min(vObj.sessions.length, 8);
    const h = Math.max(220, sessCount * 36 + 60);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('class', 'chart');
    svg.style.maxHeight = `${h}px`;

    // Center Visitor Node
    const cx = 110;
    const cy = h / 2;

    const vCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    vCircle.setAttribute('cx', String(cx));
    vCircle.setAttribute('cy', String(cy));
    vCircle.setAttribute('r', '32');
    vCircle.setAttribute('fill', 'var(--surface-elevated)');
    vCircle.setAttribute('stroke', 'var(--border-focus)');
    vCircle.setAttribute('stroke-width', '2');
    svg.appendChild(vCircle);

    const vText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    vText.setAttribute('x', String(cx));
    vText.setAttribute('y', String(cy + 4));
    vText.setAttribute('text-anchor', 'middle');
    vText.setAttribute('fill', 'var(--sea-glass)');
    vText.setAttribute('font-size', '10');
    vText.setAttribute('font-family', 'ui-monospace, monospace');
    vText.setAttribute('font-weight', '700');
    vText.textContent = vId.length > 12 ? vId.slice(0, 10) + '..' : vId;
    svg.appendChild(vText);

    // Satellite Session Nodes
    const sx = 280;
    const stepY = (h - 40) / Math.max(sessCount, 1);

    vObj.sessions.slice(0, 8).forEach((s, idx) => {
      const sy = 30 + idx * stepY + stepY / 2;
      const isEscalated = s.reached_t2;
      const tierColor = isEscalated ? 'var(--soft-brass)' : 'var(--sea-glass)';

      // Connecting spoke
      const spoke = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      spoke.setAttribute('x1', String(cx + 32));
      spoke.setAttribute('y1', String(cy));
      spoke.setAttribute('x2', String(sx));
      spoke.setAttribute('y2', String(sy));
      spoke.setAttribute('stroke', isEscalated ? 'rgba(214, 180, 141, 0.4)' : 'rgba(135, 198, 185, 0.3)');
      spoke.setAttribute('stroke-width', isEscalated ? '2' : '1.5');
      svg.appendChild(spoke);

      // Session Node Box
      const sRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      sRect.setAttribute('x', String(sx));
      sRect.setAttribute('y', String(sy - 14));
      sRect.setAttribute('width', '450');
      sRect.setAttribute('height', '28');
      sRect.setAttribute('rx', '6');
      sRect.setAttribute('fill', isEscalated ? 'var(--t2-surface)' : 'var(--surface)');
      sRect.setAttribute('stroke', tierColor);
      sRect.setAttribute('stroke-width', '1');
      sRect.style.cursor = 'pointer';
      sRect.addEventListener('click', () => {
        window.location.href = `/session?id=${encodeURIComponent(s.session_id)}`;
      });
      svg.appendChild(sRect);

      const sText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      sText.setAttribute('x', String(sx + 10));
      sText.setAttribute('y', String(sy + 4));
      sText.setAttribute('fill', 'var(--text-primary)');
      sText.setAttribute('font-size', '10.5');
      sText.setAttribute('font-family', 'ui-monospace, monospace');
      sText.style.cursor = 'pointer';
      sText.addEventListener('click', () => {
        window.location.href = `/session?id=${encodeURIComponent(s.session_id)}`;
      });
      const stSummary = s.stages ? Object.entries(s.stages).map(([k,v]) => `${k}:${v}`).join(' ') : '—';
      sText.textContent = `${s.session_id} [${isEscalated ? 'T2 ↑' : 'T1'}] · ${stSummary}`;
      svg.appendChild(sText);
    });

    constellSvgWrap.appendChild(svg);
  }

  // Visitor Grid Card
  const atlasCard = el('section', '', 'card');
  atlasCard.appendChild(el('h2', 'Visitor Profiles & Trajectory Catalog'));

  let searchQ = '';
  const searchInput = document.createElement('input');
  searchInput.placeholder = 'Search by visitor ID...';
  searchInput.setAttribute('aria-label', 'Filter visitors');
  atlasCard.appendChild(searchInput);

  const gridWrap = el('div', '', 'grid-3');
  gridWrap.style.marginTop = '14px';
  atlasCard.appendChild(gridWrap);

  function renderVisitorGrid() {
    gridWrap.replaceChildren();
    const q = searchQ.trim().toLowerCase();
    const filtered = visitors.filter(v => v.id.toLowerCase().includes(q));

    if (!filtered.length) {
      gridWrap.appendChild(el('p', visitors.length ? 'No matching visitors.' : 'NO DATA · No visitors recorded.', 'muted mono'));
      return;
    }

    for (const v of filtered) {
      const vCard = el('div', '', 'card');
      vCard.style.background = 'var(--surface-inset)';
      vCard.style.margin = '0';

      const head = el('div', '', 'tools');
      head.appendChild(el('strong', v.id, 'mono'));
      if (v.returning || v.sessions.length > 1) {
        head.appendChild(el('span', 'Recurring', 'badge done'));
      }
      if (v.escalated) {
        head.appendChild(el('span', 'Escalated T2', 'badge warn'));
      }
      vCard.appendChild(head);

      vCard.appendChild(el('div', `Total Sessions: ${v.sessions.length}`, 'muted mono'));

      // Trajectory chips
      const trajWrap = el('div', '', 'tools');
      trajWrap.style.marginTop = '8px';
      for (const st of [...v.stagesSeen].sort()) {
        const parts = st.split(':');
        trajWrap.appendChild(el('span', st, `badge ${parts[1] || ''}`));
      }
      vCard.appendChild(trajWrap);

      // Associated sessions list with deep links
      const sessList = el('div');
      sessList.style.marginTop = '10px';
      sessList.appendChild(el('div', 'Recorded Sessions:', 'muted mono'));
      for (const s of v.sessions.slice(0, 4)) {
        const row = el('div', '', 'tools');
        const sLink = document.createElement('a');
        sLink.href = `/session?id=${encodeURIComponent(s.session_id)}`;
        sLink.textContent = s.session_id;
        sLink.className = 'mono';
        sLink.style.fontSize = '11px';
        row.appendChild(sLink);
        if (s.reached_t2) row.appendChild(el('span', 'T2', 'badge warn'));
        sessList.appendChild(row);
      }
      if (v.sessions.length > 4) {
        sessList.appendChild(el('div', `+${v.sessions.length - 4} more sessions`, 'muted mono'));
      }
      vCard.appendChild(sessList);

      const inspectBtn = document.createElement('button');
      inspectBtn.type = 'button';
      inspectBtn.textContent = 'View Constellation Topology →';
      inspectBtn.style.marginTop = '8px';
      inspectBtn.style.width = '100%';
      inspectBtn.addEventListener('click', () => {
        renderConstellation(v.id);
        constellCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      vCard.appendChild(inspectBtn);

      gridWrap.appendChild(vCard);
    }
  }

  searchInput.addEventListener('input', () => {
    searchQ = searchInput.value;
    renderVisitorGrid();
  });

  renderVisitorGrid();
  if (selectedVisitorId) {
    renderConstellation(selectedVisitorId);
  }
  container.appendChild(atlasCard);
  content.replaceChildren(container);
}

  const safetyRes = getBody(1);
  const sessRes = getBody(2);

  const progMeta = progRes ? progRes.body : null;

  setStatus('Loaded laboratory verification telemetry');

  const container = el('div');

  // Architecture Topology Card
  const topoCard = el('section', '', 'card');
  topoCard.appendChild(el('h2', 'Laboratory System Topology & Deployment Status'));

  const tTable = el('table');
  const tThead = el('thead');
  const tTr = el('tr');
  for (const h of ['Component', 'Role / Architecture', 'Network Boundary', 'Verification Status']) {
    tTr.appendChild(el('th', h));
  }
  tThead.appendChild(tTr);
  const tTbody = el('tbody');

  let gkStatus = 'NOT CHECKED';
  let gkBadgeClass = 'badge';
  try {
    const gkRes = await fetchJson('/api/gatekeeper/health');
    const gkBody = gkRes ? gkRes.body : null;
    if (gkBody && gkBody.status === 'ONLINE') {
      gkStatus = 'ONLINE';
      gkBadgeClass = 'badge done';
    } else if (gkBody && gkBody.status === 'UNAVAILABLE') {
      gkStatus = 'UNAVAILABLE';
      gkBadgeClass = 'badge invalid';
    } else {
      gkStatus = 'UNKNOWN';
      gkBadgeClass = 'badge';
    }
  } catch (e) {
    gkStatus = 'UNAVAILABLE';
    gkBadgeClass = 'badge invalid';
  }

  const dbOk = sessRes && sessRes.status === 200 && sessRes.body?.status === 'ok';
  const sessCount = (dbOk && Array.isArray(sessRes.body.sessions)) ? sessRes.body.sessions.length : 0;
  const dbStatus = dbOk ? `ACCESSIBLE (${sessCount} session${sessCount === 1 ? '' : 's'} loaded)` : 'UNAVAILABLE (Store unreachable)';
  const dbBadgeClass = dbOk ? 'badge done' : 'badge invalid';

  const dashOk = progRes && progRes.status === 200;
  const dashStatus = dashOk ? 'ONLINE (Loopback HTTP 200)' : 'UNAVAILABLE';
  const dashBadgeClass = dashOk ? 'badge done' : 'badge invalid';

  const comps = [
    ['Cowrie Sensor', 'SSH deception listener & telemetry extractor', 'Local service', 'NOT CHECKED (SSH protocol requires probe)', 'badge'],
    ['Gatekeeper Policy Engine', 'Decision service (S1–S5 policy evaluation)', 'Local service', gkStatus, gkBadgeClass],
    ['SQLite Audit Store', 'Persistent append-only decision_log schema', 'Local filesystem (gatekeeper.db)', dbStatus, dbBadgeClass],
    ['Verification Dashboard', 'Offline research artifact inspector & telemetry UI', 'Local service', dashStatus, dashBadgeClass]
  ];

  for (const c of comps) {
    const tr = el('tr');
    tr.appendChild(el('td', c[0], 'mono'));
    tr.appendChild(el('td', c[1]));
    tr.appendChild(el('td', c[2], 'mono'));
    const sTd = el('td');
    sTd.appendChild(el('span', c[3], c[4]));
    tr.appendChild(sTd);
    tTbody.appendChild(tr);
  }
  tTable.append(tThead, tTbody);
  topoCard.appendChild(el('div', '', 'scroll')).appendChild(tTable);
  container.appendChild(topoCard);

  // Safety Audit Findings Card (HONEST REPORTING)
  const safeCard = el('section', '', 'card warn');
  safeCard.appendChild(el('h2', 'Safety Audit Evaluation (safety_check.json)'));

  if (safetyRes && safetyRes.body && safetyRes.body.data) {
    const sData = safetyRes.body.data;
    safeCard.appendChild(makeBadgeRow(safetyRes.body));
    const sTable = el('table');
    const sThead = el('thead');
    const sTr = el('tr');
    for (const h of ['Check Name', 'Safety Boundary Evaluated', 'Audit Outcome', 'Auditor Remediation Notes']) {
      sTr.appendChild(el('th', h));
    }
    sThead.appendChild(sTr);
    const sTbody = el('tbody');

    const checkMeta = {
      ipv4: { name: 'IPv4 0.0.0.0 Ingress Binding', desc: 'Verify sensor binds strictly to 127.0.0.1 (no external exposure)' },
      ports: { name: 'Honeypot Port Confinement', desc: 'Allowlisted honeypot listening ports (port 2222 only)' },
      secret_candidate: { name: 'Secret & Key Sanitization', desc: 'Zero unmasked credentials, API keys, or private SSH keys in source' },
      archives: { name: 'Payload Archive Execution Isolation', desc: 'No extraction or execution of captured malicious archives' },
      ignore: { name: 'Git Repository Boundary Isolation', desc: 'Verified gitignore boundaries and temporary artifact isolation' },
      bind_warning: { name: 'Non-Loopback Socket Warning', desc: 'Scan for unintended socket bind directives in deployment scripts' },
      hash_like_info: { name: 'HMAC Identifier Pseudonymization', desc: 'Verify all session and visitor hashes use salted HMAC format' }
    };

    const checks = Object.entries(sData).map(([key, val]) => {
      const info = checkMeta[key] || { name: key, desc: 'Safety isolation constraint' };
      const status = (val && val.status) ? String(val.status).toUpperCase() : 'UNKNOWN';
      const findingsCount = (val && Array.isArray(val.findings))
        ? val.findings.length
        : ((val && val.count !== undefined) ? val.count : 0);
      const isPass = status === 'PASS';
      const isFail = status === 'FAIL';
      let notes = '';
      if (isFail) {
        notes = `${findingsCount} occurrences flagged in repository. Lab safety rule requires strict 127.0.0.1 binding.`;
      } else if (isPass) {
        notes = 'Verified clean · 0 boundary violations.';
      } else {
        notes = `Status ${status} (${findingsCount} items audited).`;
      }
      return {
        name: info.name,
        description: info.desc,
        status: status,
        isPass: isPass,
        isFail: isFail,
        notes: notes
      };
    });

    for (const ch of checks) {
      const tr = el('tr');
      tr.appendChild(el('td', ch.name, 'mono'));
      tr.appendChild(el('td', ch.description));
      const oTd = el('td');
      const badgeCls = ch.isPass ? 'badge done' : (ch.isFail ? 'badge invalid' : 'badge inconclusive');
      oTd.appendChild(el('span', ch.status, badgeCls));
      tr.appendChild(oTd);
      tr.appendChild(el('td', ch.notes, 'muted'));
      sTbody.appendChild(tr);
    }
    sTable.append(sThead, sTbody);
    safeCard.appendChild(el('div', '', 'scroll')).appendChild(sTable);
  } else {
    safeCard.appendChild(el('p', 'NO DATA · safety_check.json unavailable.', 'muted mono'));
  }
  container.appendChild(safeCard);

  // Progress Checklist Card
  const progCard = el('section', '', 'card');
  progCard.appendChild(el('h2', 'Project Engineering Progress Checklist'));
  const pData = progRes && progRes.body ? progRes.body.data : null;
  const pNote = (progRes && progRes.body && progRes.body.note)
    ? progRes.body.note
    : 'Weighted checklist of project work, not a performance measure.';
  progCard.appendChild(el('p', pNote, 'muted'));
  if (progRes && progRes.body) progCard.appendChild(makeBadgeRow(progRes.body));

  if (pData && Array.isArray(pData.items)) {
    const summaryLine = el('p', `Earned ${pData.earned} / ${pData.total} (${pData.percentage}%)`, 'kpi-value');
    progCard.appendChild(summaryLine);

    const tblWrap = el('div', '', 'scroll');
    const tbl = el('table');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['Work Item', 'Weight', 'Status', 'Technical Notes']) htr.appendChild(el('th', h));
    thead.appendChild(htr);
    const tbody = el('tbody');
    for (const row of pData.items) {
      const tr = el('tr');
      tr.appendChild(el('td', row[0]));
      tr.appendChild(el('td', String(row[1]), 'mono'));
      const stTd = el('td');
      stTd.appendChild(el('span', row[2], statusClass(row[2] === 'Done' ? 'done' : row[2] === 'Partial' ? 'exploratory' : 'NOT RUN')));
      tr.appendChild(stTd);
      tr.appendChild(el('td', row[3], 'muted'));
      tbody.appendChild(tr);
    }
    tbl.append(thead, tbody);
    tblWrap.appendChild(tbl);
    progCard.appendChild(tblWrap);
  } else {
    progCard.appendChild(el('p', 'NO DATA · Progress checklist unavailable.', 'muted mono'));
  }
  container.appendChild(progCard);

  content.replaceChildren(container);
}

    content.appendChild(card);
    try {
      const {body} = await fetchJson('/api/evidence/' + id);
      setBanner(body);
      card.append(el('h2', body.title || id), makeBadgeRow(body));
      card.appendChild(body.kind === 'markdown' ? el('pre', body.data.text) : renderJsonTree(body.data));
    } catch {
      card.appendChild(el('p', 'NO DATA'));
    }
  }
  setStatus('Evidence request complete');
}

(function boot() {
  const path = window.location.pathname;
  if (path === '/evidence') initEvidence();
  else if (path === '/ml') initMl();
  else if (path === '/cost') initCost();
  else if (path === '/session') initSession();
  else if (path === '/visitors') initVisitors();
  else if (path === '/deception') initDeception();
  else if (path === '/replay') showReports(['REPLAY_RESULT', 'selection', 'observations']);
  else if (path === '/detector') showReports(['DETECTOR_RESULT']);
  else if (path === '/lab') initLab();
})();
</script>
</body>
</html>
